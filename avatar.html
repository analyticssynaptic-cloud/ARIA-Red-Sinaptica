<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ARIA — Avatar Tron 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:100;background:#000;transition:opacity .6s}
.spinner{width:48px;height:48px;border:2px solid #001830;border-top:2px solid #00d4ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load-text{color:#00d4ff;font-size:11px;letter-spacing:3px;margin-top:18px;opacity:.65}

#ui{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
#ui h1{font-size:11px;color:#00d4ff;letter-spacing:5px;font-weight:300;text-transform:uppercase;text-shadow:0 0 18px rgba(0,200,255,.9)}
#ui p{font-size:7.5px;color:rgba(100,160,210,.35);letter-spacing:2px;margin-top:3px}

#status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:9px;color:rgba(0,212,255,.45);letter-spacing:3px;z-index:10;pointer-events:none;white-space:nowrap}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#00dc50;box-shadow:0 0 8px #00dc50;vertical-align:middle;margin-right:5px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

#hint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);color:rgba(100,160,210,.28);font-size:9px;letter-spacing:1.5px;z-index:10;pointer-events:none;animation:fadeout 4s 6s forwards}
@keyframes fadeout{to{opacity:0}}

.name-lbl{font-size:15px;font-weight:800;letter-spacing:6px;color:#00d4ff;
  text-shadow:0 0 14px #00d4ff,0 0 28px rgba(0,212,255,.4);
  pointer-events:none;user-select:none;white-space:nowrap}

#btns{position:fixed;bottom:36px;right:14px;z-index:10;display:flex;flex-direction:column;gap:7px}
#btns button{background:rgba(0,20,60,.85);border:1px solid rgba(0,150,255,.35);color:#88ccff;
  padding:7px 14px;border-radius:6px;cursor:pointer;font-size:11px;letter-spacing:1px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#btns button:active{background:rgba(0,60,160,.85)}
#btns button.active{border-color:rgba(0,200,255,.8);color:#00d4ff;box-shadow:0 0 8px rgba(0,180,255,.3)}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div id="load-text">INICIALIZANDO AVATAR...</div>
</div>
<div id="ui">
  <h1>ARIA &mdash; Avatar Tron 3D</h1>
  <p>Synaptic Analytics &middot; v2026.11 &middot; GLB + Three.js</p>
</div>
<div id="hint">ARRASTRÁ PARA GIRAR &middot; PELLIZCA PARA ZOOM</div>
<div id="status"><span class="dot"></span>ARIA ACTIVA &middot; ESCUCHANDO</div>
<div id="btns">
  <button id="btn-idle" class="active" onclick="setAnim('Idle')">⏸ Idle</button>
  <button id="btn-walk" onclick="setAnim('Walk')">▶ Walk</button>
  <button id="btn-run" onclick="setAnim('Run')">⚡ Run</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

const MODEL_URL='https://raw.githubusercontent.com/mrdoob/three.js/r158/examples/models/gltf/Soldier.glb';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x000000,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
document.body.insertBefore(renderer.domElement,document.body.firstChild);

const css2d=new CSS2DRenderer();
css2d.setSize(window.innerWidth,window.innerHeight);
css2d.domElement.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:5;overflow:hidden';
document.body.appendChild(css2d.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,0.025);

const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.05,200);
camera.position.set(0,1.0,5.0);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.0,0);
controls.enableDamping=true;controls.dampingFactor=0.06;
controls.minDistance=1.5;controls.maxDistance=16;
controls.maxPolarAngle=Math.PI*0.80;
controls.update();

// ── Luces Tron ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x001122,2.8));
// Luz frontal suave
const frontLight=new THREE.DirectionalLight(0x0088cc,1.0);
frontLight.position.set(0,3,4);scene.add(frontLight);
// Rim/silueta por detrás (clave en Tron)
const rimLight=new THREE.DirectionalLight(0x00d4ff,3.0);
rimLight.position.set(0,2,-3);scene.add(rimLight);
// Lados
const leftLight=new THREE.PointLight(0x0033ff,1.6,10);
leftLight.position.set(-3,2,1);scene.add(leftLight);
const rightLight=new THREE.PointLight(0x00aaff,1.2,10);
rightLight.position.set(3,2,1);scene.add(rightLight);
// Piso glow
const floorLight=new THREE.PointLight(0x00d4ff,3.5,5);
floorLight.position.set(0,0.4,0);scene.add(floorLight);

// ── Estrellas ─────────────────────────────────────────────────────────────────
{const geo=new THREE.BufferGeometry();const n=1500,p=new Float32Array(n*3);
 for(let i=0;i<n*3;i++)p[i]=(Math.random()-.5)*120;
 geo.setAttribute('position',new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0x334466,size:0.07,sizeAttenuation:true})));}

// ── Piso Tron ─────────────────────────────────────────────────────────────────
{
  const grid=new THREE.GridHelper(16,32,0x002244,0x000e22);
  grid.material.opacity=0.55;grid.material.transparent=true;
  scene.add(grid);

  const gc=document.createElement('canvas');gc.width=gc.height=256;
  const gx=gc.getContext('2d');
  const gr=gx.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(0,180,255,0.55)');
  gr.addColorStop(0.4,'rgba(0,100,200,0.15)');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  gx.fillStyle=gr;gx.fillRect(0,0,256,256);
  const fgSp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(gc),transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  fgSp.scale.set(5.5,5.5,1);fgSp.position.y=0.02;
  scene.add(fgSp);
}

// ── Anillos de onda (emanan del suelo) ────────────────────────────────────────
const waveRings=Array.from({length:3},(_,i)=>{
  const rm=new THREE.Mesh(
    new THREE.TorusGeometry(0.5,0.014,6,80),
    new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,
      opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  rm.rotation.x=Math.PI/2;rm.position.y=0.015;
  scene.add(rm);
  return{mesh:rm,phase:i/3};
});

// ── Partículas orbitales ──────────────────────────────────────────────────────
const floatPts=Array.from({length:30},()=>{
  const pm=new THREE.Mesh(
    new THREE.SphereGeometry(0.016,4,4),
    new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,
      opacity:0.5,blending:THREE.AdditiveBlending}));
  const ang=Math.random()*Math.PI*2,r=0.65+Math.random()*0.9;
  pm.position.set(Math.cos(ang)*r,Math.random()*2.0,Math.sin(ang)*r);
  scene.add(pm);
  return{mesh:pm,ang,r,yBase:pm.position.y,
    spd:0.003+Math.random()*0.004,yAmp:0.1+Math.random()*0.15,yOff:Math.random()*Math.PI*2};
});

// ── Disco de identidad (Tron) ─────────────────────────────────────────────────
const discGroup=new THREE.Group();
{
  const torus=new THREE.Mesh(
    new THREE.TorusGeometry(0.24,0.028,10,64),
    new THREE.MeshStandardMaterial({color:0x001525,metalness:0.9,roughness:0.08,
      emissive:0x00d4ff,emissiveIntensity:0.9}));
  discGroup.add(torus);
  const inner=new THREE.Mesh(
    new THREE.CircleGeometry(0.21,32),
    new THREE.MeshBasicMaterial({color:0x001a30,transparent:true,opacity:0.5,side:THREE.DoubleSide}));
  discGroup.add(inner);
  for(let j=0;j<4;j++){
    const a=j*Math.PI/4;
    const pts=[
      new THREE.Vector3(Math.cos(a)*0.21,Math.sin(a)*0.21,0.001),
      new THREE.Vector3(-Math.cos(a)*0.21,-Math.sin(a)*0.21,0.001)];
    discGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:0.45})));
  }
  // Glow del disco
  const gc2=document.createElement('canvas');gc2.width=gc2.height=128;
  const gx2=gc2.getContext('2d');
  const gr2=gx2.createRadialGradient(64,64,0,64,64,64);
  gr2.addColorStop(0,'rgba(0,180,255,0.7)');
  gr2.addColorStop(1,'rgba(0,0,0,0)');
  gx2.fillStyle=gr2;gx2.fillRect(0,0,128,128);
  const dGlow=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(gc2),transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  dGlow.scale.setScalar(0.7);
  discGroup.add(dGlow);
  discGroup.position.set(0.95,1.3,0.25);
}
scene.add(discGroup);

// ── Cargar modelo GLB ─────────────────────────────────────────────────────────
let mixer=null,actions={},currentAction=null;
const edgeMeshes=[];

function setAnim(name){
  if(!actions[name]) return;
  document.querySelectorAll('#btns button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+name.toLowerCase())?.classList.add('active');
  if(currentAction){
    currentAction.fadeOut(0.3);
  }
  actions[name].reset().fadeIn(0.3).play();
  currentAction=actions[name];
}
window.setAnim=setAnim;

const loader=new GLTFLoader();
loader.load(MODEL_URL,(gltf)=>{
  const loadDiv=document.getElementById('loading');
  loadDiv.style.opacity='0';
  setTimeout(()=>loadDiv.style.display='none',600);

  const model=gltf.scene;
  model.position.set(0,0,0);

  // Aplicar materiales Tron a todos los meshes
  model.traverse(child=>{
    if(!child.isMesh) return;
    // Material base: traje negro metálico
    child.material=new THREE.MeshStandardMaterial({
      color:0x000810,
      metalness:0.98,
      roughness:0.06,
      emissive:new THREE.Color(0x002244),
      emissiveIntensity:0.55,
    });
    child.castShadow=false;child.receiveShadow=false;

    // Líneas de circuito cyan (EdgesGeometry = estilo Tron)
    const edges=new THREE.EdgesGeometry(child.geometry,18);
    const edgeMat=new THREE.LineBasicMaterial({
      color:0x00d4ff,transparent:true,opacity:0.65,
      blending:THREE.AdditiveBlending,depthWrite:false});
    const edgeMesh=new THREE.LineSegments(edges,edgeMat);
    child.add(edgeMesh);
    edgeMeshes.push({mesh:edgeMesh,phase:Math.random()*Math.PI*2});
  });

  // Label ARIA encima de la cabeza
  const nameLbl=document.createElement('div');
  nameLbl.className='name-lbl';nameLbl.textContent='ARIA';
  const nameObj=new CSS2DObject(nameLbl);
  nameObj.position.set(0,2.08,0);
  model.add(nameObj);

  // Configurar animaciones
  mixer=new THREE.AnimationMixer(model);
  gltf.animations.forEach(clip=>{
    const a=mixer.clipAction(clip);
    a.clampWhenFinished=false;
    actions[clip.name]=a;
  });

  // Comenzar con Idle
  const idleClip=gltf.animations.find(a=>a.name==='Idle')||gltf.animations[0];
  if(idleClip){
    currentAction=mixer.clipAction(idleClip);
    currentAction.play();
  }

  // Ajustar cámara para ver cuerpo completo (cabeza a pies)
  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const dist=Math.max(size.x,size.y,size.z)*1.9;
  camera.position.set(center.x,center.y*0.9,center.z+dist);
  controls.target.set(center.x,center.y*0.85,center.z);
  controls.update();

  scene.add(model);
  console.log('Modelo cargado. Animaciones:',gltf.animations.map(a=>a.name));

},(xhr)=>{
  if(xhr.total>0){
    document.getElementById('load-text').textContent=
      `CARGANDO... ${Math.round(xhr.loaded/xhr.total*100)}%`;
  }
},(err)=>{
  document.getElementById('load-text').textContent='ERROR — verificá conexión';
  console.error('GLTF error:',err);
});

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  css2d.setSize(window.innerWidth,window.innerHeight);
});

// ── Animación ─────────────────────────────────────────────────────────────────
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta();
  const t=clock.elapsedTime;

  if(mixer) mixer.update(delta);

  // Flicker de líneas Tron
  edgeMeshes.forEach(e=>{
    e.mesh.material.opacity=0.42+Math.sin(t*3.5+e.phase)*0.24;
  });

  // Luces pulsantes
  floorLight.intensity=3.0+Math.sin(t*2.1)*1.2;
  rimLight.intensity=2.5+Math.sin(t*1.4)*0.8;
  leftLight.intensity=1.4+Math.sin(t*1.9+1)*0.5;

  // Ondas del piso (expanden y se desvanecen)
  waveRings.forEach(w=>{
    const prog=(t*0.32+w.phase)%1;
    const r=0.25+prog*2.8;
    w.mesh.scale.set(r,r,r);
    w.mesh.material.opacity=(1-prog)*0.55;
  });

  // Partículas flotantes
  floatPts.forEach(p=>{
    p.ang+=p.spd;
    p.mesh.position.x=Math.cos(p.ang)*p.r;
    p.mesh.position.z=Math.sin(p.ang)*p.r;
    p.mesh.position.y=p.yBase+Math.sin(t*1.2+p.yOff)*p.yAmp;
    p.mesh.material.opacity=0.3+Math.sin(t*2+p.ang)*0.2;
  });

  // Disco identidad: rota y orbita levemente
  discGroup.rotation.z=t*1.9;
  discGroup.rotation.y=t*0.28;
  discGroup.position.x=0.95+Math.sin(t*0.52)*0.1;
  discGroup.position.y=1.3+Math.sin(t*0.73)*0.09;

  controls.update();
  renderer.render(scene,camera);
  css2d.render(scene,camera);
}
animate();
</script>
</body></html>
