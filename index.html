<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARIA — Red Sináptica · Synaptic Analytics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#07071a;font-family:'Segoe UI',system-ui,sans-serif;color:#e2e8f0;overflow:hidden;}
canvas{display:block;}
.top{position:fixed;top:0;left:0;right:0;padding:16px 30px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(7,7,26,.95),transparent);z-index:10;pointer-events:none;}
.brand{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:#a78bfa;font-weight:700;}
.brand em{color:#fff;font-style:normal;}
.hint{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);}
.tt{position:fixed;background:rgba(10,10,35,.97);border:1px solid #4c1d95;border-radius:8px;padding:14px 18px;pointer-events:none;opacity:0;transition:opacity .15s;max-width:270px;font-size:.82rem;line-height:1.65;z-index:20;}
.tt b{color:#c4b5fd;display:block;margin-bottom:5px;font-size:.9rem;}
.tt .tg{display:inline-block;background:#312e81;color:#c7d2fe;font-size:.6rem;padding:2px 6px;border-radius:3px;margin:4px 2px 0 0;letter-spacing:.4px;}
.leg{position:fixed;bottom:20px;left:26px;display:flex;flex-direction:column;gap:7px;z-index:10;}
.li{display:flex;align-items:center;gap:9px;font-size:.67rem;color:rgba(255,255,255,.55);letter-spacing:.4px;}
.ld{width:9px;height:9px;border-radius:50%;}
.note{position:fixed;bottom:20px;right:26px;font-size:.62rem;color:rgba(255,255,255,.3);letter-spacing:.5px;text-align:right;}
</style>
</head>
<body>
<div class="top">
  <div><div class="brand"><em>ARIA</em> — Red Sináptica</div><div class="hint" style="margin-top:3px;">Synaptic Analytics · Nov 2026</div></div>
  <div class="hint">Hover = detalles del nodo</div>
</div>
<canvas id="c"></canvas>
<div class="tt" id="tt"></div>
<div class="leg">
  <div class="li"><div class="ld" style="background:#7c3aed"></div>Núcleo ARIA</div>
  <div class="li"><div class="ld" style="background:#ef4444"></div>Fuentes de Datos (Sheets)</div>
  <div class="li"><div class="ld" style="background:#f97316"></div>Agentes de Procesamiento</div>
  <div class="li"><div class="ld" style="background:#8b5cf6"></div>Servicios Diarios</div>
  <div class="li"><div class="ld" style="background:#06b6d4"></div>Canales de Salida</div>
  <div class="li"><div class="ld" style="background:#22c55e"></div>APIs Externas</div>
</div>
<div class="note">analyticssynaptic-cloud · GitHub Pages</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const tt = document.getElementById('tt');
let W,H,cx,cy,animT=0,hov=null;

function r(h){return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);}

const NODES = [
  {id:'aria',   lbl:'ARIA',           sub:'Orquestadora',            ox:0,    oy:0,    R:56, c:'#7c3aed', g:'#a855f7',
   d:'Núcleo central. Orquesta todos los agentes Python sin consumir tokens. Solo usa Claude en conversación directa con el usuario.',
   tags:['Claude Sonnet 4.6','Python local','Telegram']},

  // Fuentes datos — izquierda
  {id:'sbq',    lbl:'PQP\nBarranquillita', sub:'Google Sheets',      ox:-400, oy:-230, R:38, c:'#ef4444', g:'#fca5a5',
   d:'Sheet: Data Actividad PQP Barranquillita. Hojas: Ingresos, Ventas, Muestras, Premios. Fecha: YYYY-MM-DD. CSV público sin auth.',
   tags:['Barranquilla','CSV export','Sin auth']},
  {id:'spqp',   lbl:'PQP\nGeneral',    sub:'Google Sheets',          ox:-400, oy:0,    R:38, c:'#ef4444', g:'#fca5a5',
   d:'Sheet: Datos Mercaderismo PQP. 398 registros. Ciudades: Medellín, Bucaramanga, Barranquilla. Fecha: DD/MM/YYYY.',
   tags:['Multi-ciudad','CSV export','398 reg']},
  {id:'shenkel',lbl:'Henkel\nGLISS',   sub:'Google Sheets (pendiente)', ox:-400, oy:230, R:38, c:'#ef4444', g:'#fca5a5',
   d:'Sheet Henkel GLISS pendiente de configuración. Estructura similar al PQP General.',
   tags:['Pendiente','CSV export']},

  // Agentes procesamiento — centro izquierda
  {id:'apqp',   lbl:'Agente PQP',       sub:'agente_pqp.py',         ox:-200, oy:-195, R:33, c:'#f97316', g:'#fdba74',
   d:'Lee ambos Sheets PQP por CSV. Filtra por hoy. Genera resumen de ingresos, ventas y muestras. Envía audio + texto a Telegram.',
   tags:['Sin tokens','reporte_pqp()','reporte_pqp_general()']},
  {id:'ainf',   lbl:'Informe\nCampaña', sub:'agente_informe_campana.py', ox:-200, oy:0, R:33, c:'#f97316', g:'#fdba74',
   d:'Genera HTML con KPIs, Chart.js, tabla mercaderistas y reglas generales automáticas. preparar_informe() solo local. crear_informe() publica en GitHub.',
   tags:['preparar_informe()','crear_informe()','GitHub Pages']},
  {id:'arep',   lbl:'Reportes\nVisuales', sub:'agente_reportes.py',  ox:-200, oy:195,  R:33, c:'#f97316', g:'#fdba74',
   d:'Genera reportes PNG con matplotlib. KPIs, tablas y gráficos. Envía como foto por Telegram.',
   tags:['matplotlib','PNG','Telegram foto']},

  // Servicios diarios — centro derecha
  {id:'abrief', lbl:'Briefing\nMatutino', sub:'agente_briefing.py',  ox:200, oy:-230, R:33, c:'#8b5cf6', g:'#c4b5fd',
   d:'Briefing automático a las 7:00 AM. Clima Bogotá, noticia del día, recordatorios y frase motivacional. Envía nota de voz SalomeNeural.',
   tags:['7:00 AM','Task Scheduler','SalomeNeural']},
  {id:'ajuegos',lbl:'Monitor\nJuegos',   sub:'agente_monitor_juegos.py', ox:200, oy:-75, R:33, c:'#8b5cf6', g:'#c4b5fd',
   d:'Monitorea 15 juegos en Steam y Epic. Alerta al ≥70% descuento o gratis. Reporte diario a las 10:00 AM.',
   tags:['10:00 AM','Steam API','Epic API']},
  {id:'aviajes',lbl:'Viajes',            sub:'agente_viajes.py',     ox:200, oy:75,   R:33, c:'#8b5cf6', g:'#c4b5fd',
   d:'Paquetes vuelo+hotel desde Bogotá. 12 rutas nacionales/internacionales, sondeo de fechas. Links Despegar, Booking, Skyscanner.',
   tags:['8:30 AM','12 rutas','Despegar/Booking']},
  {id:'aubic',  lbl:'Ubicación',         sub:'agente_ubicacion.py',  ox:200, oy:230, R:33, c:'#8b5cf6', g:'#c4b5fd',
   d:'GPS del usuario → geocodificación inversa Nominatim + clima Open-Meteo + lugares cercanos Overpass/OSM.',
   tags:['Sin tokens','Nominatim','Open-Meteo']},

  // Salidas — derecha
  {id:'otg',    lbl:'Telegram',          sub:'Bot @ARIA',             ox:400, oy:-160, R:36, c:'#06b6d4', g:'#67e8f9',
   d:'Bot Telegram principal. Recibe texto, voz e imágenes. Responde con mensajes, notas de voz OGG Opus, fotos y documentos.',
   tags:['sendMessage','sendVoice','sendPhoto']},
  {id:'ogh',    lbl:'GitHub\nPages',     sub:'analyticssynaptic-cloud', ox:400, oy:10, R:36, c:'#22c55e', g:'#86efac',
   d:'Organización analyticssynaptic-cloud. 50+ repos activos. Reportes HTML con Chart.js publicados como GitHub Pages.',
   tags:['50+ repos','Chart.js','Pages activo']},
  {id:'otts',   lbl:'Edge TTS\nSalomé',  sub:'es-CO-SalomeNeural',   ox:400, oy:175, R:36, c:'#06b6d4', g:'#67e8f9',
   d:'Voz colombiana. Rate +0%, Pitch +12Hz. Genera MP3 → convierte a OGG Opus con ffmpeg → Telegram sendVoice.',
   tags:['SalomeNeural','OGG Opus','ffmpeg']},

  // APIs externas — esquinas
  {id:'xsteam', lbl:'Steam\nEpic',       sub:'APIs gaming',           ox:-350, oy:340, R:26, c:'#22c55e', g:'#86efac',
   d:'Steam Store API: precios COP por appid. Epic Promotions API: juegos gratuitos. Sin API key.',
   tags:['Sin auth','COP','JSON']},
  {id:'xmeteo', lbl:'Open-Meteo\nNominatim', sub:'Clima + GPS',       ox:350, oy:340, R:26, c:'#22c55e', g:'#86efac',
   d:'Open-Meteo: clima por coordenadas. Nominatim/OSM: geocodificación inversa y lugares cercanos. Sin API key.',
   tags:['Sin auth','GPS','OSM']},
  {id:'xgtrans',lbl:'Google\nTranslate', sub:'API informal',          ox:-350, oy:-340, R:26, c:'#22c55e', g:'#86efac',
   d:'API informal de Google Translate. Sin API key. Fallback a Claude si falla. Detección automática de idioma.',
   tags:['Sin key','15 idiomas','Fallback Claude']},
  {id:'xrss',   lbl:'RSS\nNoticias',     sub:'El Tiempo',             ox:350, oy:-340, R:26, c:'#22c55e', g:'#86efac',
   d:'Feed RSS de El Tiempo. Extrae titular del día para el briefing matutino. Sin API key.',
   tags:['RSS','Sin auth','Briefing']},
];

const EDGES=[
  ['sbq','apqp'],['spqp','apqp'],['sbq','ainf'],['spqp','ainf'],['shenkel','ainf'],
  ['apqp','aria'],['ainf','aria'],['arep','aria'],
  ['abrief','aria'],['ajuegos','aria'],['aviajes','aria'],['aubic','aria'],
  ['aria','otg'],['aria','ogh'],['aria','otts'],
  ['ainf','ogh'],['abrief','otts'],['apqp','otts'],
  ['xsteam','ajuegos'],['xmeteo','aubic'],['xmeteo','abrief'],
  ['xgtrans','aria'],['xrss','abrief'],
];

let nm={};
function mapN(){NODES.forEach(n=>{n.px=cx+n.ox;n.py=cy+n.oy;nm[n.id]=n;});}

function drawEdge(a,b,t){
  const dx=b.px-a.px,dy=b.py-a.py,dist=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/dist,uy=dy/dist;
  const x1=a.px+ux*a.R,y1=a.py+uy*a.R;
  const x2=b.px-ux*b.R,y2=b.py-uy*b.R;
  const mx=(x1+x2)/2-(y2-y1)*0.06,my=(y1+y2)/2+(x2-x1)*0.06;
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,`rgba(${r(a.c)},0.1)`);
  g.addColorStop(t,`rgba(${r(b.c)},0.85)`);
  g.addColorStop(1,`rgba(${r(b.c)},0.08)`);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);
  ctx.strokeStyle=g;ctx.lineWidth=1.3;ctx.stroke();
  // pulse
  const bx=(1-t)*(1-t)*x1+2*(1-t)*t*mx+t*t*x2;
  const by=(1-t)*(1-t)*y1+2*(1-t)*t*my+t*t*y2;
  ctx.beginPath();ctx.arc(bx,by,2.2,0,Math.PI*2);
  ctx.fillStyle=`rgba(${r(b.c)},0.9)`;ctx.fill();
}

function drawNode(n,hov){
  const sc=hov?1.1:1, R=n.R*sc;
  if(hov||n.id==='aria'){
    ctx.save();ctx.globalAlpha=0.1;ctx.fillStyle=n.g;
    ctx.beginPath();ctx.arc(n.px,n.py,R*2.4,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  ctx.beginPath();ctx.arc(n.px,n.py,R+2.5,0,Math.PI*2);
  ctx.strokeStyle=`rgba(${r(n.c)},${hov?0.95:0.4})`;ctx.lineWidth=hov?2:1;ctx.stroke();
  const g=ctx.createRadialGradient(n.px-R*.25,n.py-R*.25,0,n.px,n.py,R);
  g.addColorStop(0,n.c+'ee');g.addColorStop(1,n.c+'55');
  ctx.beginPath();ctx.arc(n.px,n.py,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='center';
  const lines=n.lbl.split('\n'),lh=Math.max(10,R/3.2);
  const fs=Math.max(8,R/3.8);
  ctx.font=`bold ${fs}px 'Segoe UI',sans-serif`;
  lines.forEach((l,i)=>ctx.fillText(l,n.px,n.py+(i-(lines.length-1)/2)*lh+(n.id==='aria'?-5:0)));
  if(n.id==='aria'){ctx.font=`500 ${Math.max(7,R/6)}px 'Segoe UI',sans-serif`;ctx.fillStyle='#c4b5fd';ctx.fillText('Orquestadora',n.px,n.py+22);}
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.025)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  mapN();animT=(animT+0.005)%1;
  EDGES.forEach((e,i)=>{const a=nm[e[0]],b=nm[e[1]];if(a&&b)drawEdge(a,b,(animT+i*0.06)%1);});
  NODES.forEach(n=>drawNode(n,n===hov));
  requestAnimationFrame(draw);
}

function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;cx=W/2;cy=H/2;}
window.addEventListener('resize',resize);

cv.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  hov=null;
  for(const n of NODES){const dx=mx-n.px,dy=my-n.py;if(dx*dx+dy*dy<(n.R+10)*(n.R+10)){hov=n;break;}}
  if(hov){
    const tags=(hov.tags||[]).map(t=>`<span class="tg">${t}</span>`).join('');
    tt.innerHTML=`<b>${hov.lbl.replace('\n',' ')} <small style="color:#9ca3af;font-weight:400;font-size:.72rem">${hov.sub||''}</small></b>${hov.d}<br>${tags}`;
    tt.style.opacity='1';
    tt.style.left=Math.min(e.clientX+16,W-290)+'px';
    tt.style.top=Math.max(e.clientY-50,10)+'px';
    cv.style.cursor='pointer';
  } else {tt.style.opacity='0';cv.style.cursor='default';}
});

resize();draw();
</script>
</body>
</html>
