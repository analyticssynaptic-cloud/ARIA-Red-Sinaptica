<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ARIA — Red Neuronal 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
canvas{display:block}
#ui{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none;white-space:nowrap}
#ui h1{font-size:11px;color:#00d4ff;letter-spacing:4px;font-weight:300;text-transform:uppercase;text-shadow:0 0 18px rgba(0,200,255,.95)}
#ui p{font-size:7.5px;color:rgba(100,160,210,.45);letter-spacing:2px;margin-top:2px}
#tooltip{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:rgba(4,12,38,.97);border:1px solid rgba(0,180,255,.4);
  border-radius:10px;padding:12px 20px;z-index:20;
  color:#cce4ff;font-size:12px;min-width:220px;max-width:320px;text-align:center;
  display:none;pointer-events:none;backdrop-filter:blur(10px);
  box-shadow:0 4px 24px rgba(0,180,255,.15);
}
#tooltip strong{color:#00d4ff;display:block;margin-bottom:5px;font-size:15px;letter-spacing:.5px}
#tooltip .sub{font-size:10.5px;opacity:.8;line-height:1.5}
#tooltip .cat{font-size:9px;opacity:.45;margin-top:7px;letter-spacing:1.5px;text-transform:uppercase}
#hint{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  color:rgba(100,160,210,.4);font-size:10px;letter-spacing:1px;z-index:10;pointer-events:none;
  animation:fadeout 4s 2s forwards}
@keyframes fadeout{to{opacity:0}}
#legend{position:fixed;bottom:16px;left:12px;z-index:10;display:flex;flex-wrap:wrap;gap:3px 10px;max-width:200px}
.li{display:flex;align-items:center;gap:4px;font-size:7px;color:rgba(140,185,225,.5)}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0}
#ctrl{position:fixed;bottom:16px;right:12px;z-index:10;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#ctrl button{background:rgba(0,20,60,.88);border:1px solid rgba(0,150,255,.38);color:#88ccff;
  padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#ctrl button:active{background:rgba(0,60,160,.85)}
.lbl{color:#fff;font-size:9px;padding:2px 6px;background:rgba(0,0,0,.6);
  border-radius:4px;pointer-events:none;white-space:nowrap;user-select:none}
.lbl-hub{font-size:10.5px;font-weight:600;padding:3px 8px}
.lbl-aria{font-size:15px;font-weight:800;letter-spacing:4px;color:#00d4ff!important;
  text-shadow:0 0 14px #00d4ff;background:transparent;padding:0}
</style>

<body>

<div id="ui">
  <h1>ARIA — RED NEURONAL 3D</h1>

</div>

</div>
<div id="legend"></div>
<div id="ctrl">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ── Datos ─────────────────────────────────────────────────────────────────────
const C = {
  aria:  {name:'ARIA Core',      hex:0x00d4ff, css:'#00d4ff'},
  ia:    {name:'Stack IA',       hex:0x7E57C2, css:'#7E57C2'},
  canal: {name:'Canales',        hex:0x2196F3, css:'#2196F3'},
  agent: {name:'Agentes',        hex:0xFF6F00, css:'#FF6F00'},
  rep:   {name:'Reportes',       hex:0xFFD600, css:'#FFD600'},
  integ: {name:'Integraciones',  hex:0x26C6DA, css:'#26C6DA'},
  media: {name:'Medios',         hex:0x00C853, css:'#00C853'},
  mem:   {name:'Memoria',        hex:0xF50057, css:'#F50057'},
  auto:  {name:'Automatización', hex:0xAB47BC, css:'#AB47BC'},
};

const HUBS = [
  {id:'h-ia',    label:'Stack IA',   cat:'ia'},
  {id:'h-canal', label:'Canales',    cat:'canal'},
  {id:'h-agent', label:'Agentes',    cat:'agent'},
  {id:'h-rep',   label:'Reportes',   cat:'rep'},
  {id:'h-integ', label:'Integrac.',  cat:'integ'},
  {id:'h-media', label:'Medios',     cat:'media'},
  {id:'h-mem',   label:'Memoria',    cat:'mem'},
  {id:'h-auto',  label:'Automatiz.', cat:'auto'},
];

const AGENTS = [
  // Stack IA
  {id:'a-ollama',   label:'Ollama local',    cat:'ia',    hub:'h-ia',    tip:'qwen2.5 · respuestas locales rápidas'},
  {id:'a-groq',     label:'Groq Cloud',      cat:'ia',    hub:'h-ia',    tip:'LLaMA 3.3 · respuestas intermedias'},
  {id:'a-claude',   label:'Claude Sonnet',   cat:'ia',    hub:'h-ia',    tip:'Anthropic 4.6 · análisis complejo'},
  // Canales
  {id:'a-tg',       label:'Telegram Bot',    cat:'canal', hub:'h-canal', tip:'getUpdates · sendVoice · fotos'},
  {id:'a-voz',      label:'Voz STT',         cat:'canal', hub:'h-canal', tip:'Whisper / Groq STT · OGG Opus'},
  {id:'a-foto',     label:'Fotos',           cat:'canal', hub:'h-canal', tip:'Fotos → Google Drive automático'},
  // Agentes
  {id:'a-calcu',    label:'Calculadora',     cat:'agent', hub:'h-agent', tip:'Cálculos locales sin IA'},
  {id:'a-clima',    label:'Clima',           cat:'agent', hub:'h-agent', tip:'agente_clima · tiempo real'},
  {id:'a-notic',    label:'Noticias',        cat:'agent', hub:'h-agent', tip:'agente_noticias · titulares'},
  {id:'a-rec',      label:'Recordatorios',   cat:'agent', hub:'h-agent', tip:'Alarmas y tareas pendientes'},
  {id:'a-juegos',   label:'Monitor Juegos',  cat:'agent', hub:'h-agent', tip:'Steam · estado de juegos'},
  {id:'a-empleo',   label:'Empleos',         cat:'agent', hub:'h-agent', tip:'Ofertas de trabajo activas'},
  // Reportes
  {id:'a-debate',   label:'Debate Agentes',  cat:'rep',   hub:'h-rep',   tip:'Claude vs Groq · 3 rondas de debate'},
  {id:'a-pdf',      label:'Generador PDF',   cat:'rep',   hub:'h-rep',   tip:'agente_pdf · fpdf2'},
  {id:'a-dolores',  label:'Dolores Lunes',   cat:'rep',   hub:'h-rep',   tip:'Ventas · análisis cada lunes'},
  {id:'a-henkel',   label:'Henkel IX',       cat:'rep',   hub:'h-rep',   tip:'Informe campana · GitHub Pages'},
  {id:'a-campana',  label:'Campanas',        cat:'rep',   hub:'h-rep',   tip:'Análisis de campañas activas'},
  {id:'a-pqpmon',   label:'Monitor PQP',     cat:'rep',   hub:'h-rep',   tip:'PDVs faltantes · alertas 8 PM diarias'},
  {id:'a-bqllita',  label:'Barranquillita',  cat:'rep',   hub:'h-rep',   tip:'PQP campaña IV · informe interactivo'},
  // Integraciones
  {id:'a-drive',    label:'Google Drive',    cat:'integ', hub:'h-integ', tip:'OAuth · fotos · CLASP · respaldo'},
  {id:'a-gh',       label:'GitHub API',      cat:'integ', hub:'h-integ', tip:'Pages · repos · deploy HTML'},
  {id:'a-tts',      label:'Edge TTS',        cat:'integ', hub:'h-integ', tip:'SalomeNeural · OGG Opus · voz'},
  {id:'a-stt2',     label:'Whisper',         cat:'integ', hub:'h-integ', tip:'Transcripción de audio a texto'},
  {id:'a-backup',   label:'Backup Drive',    cat:'integ', hub:'h-integ', tip:'Respaldo automático 2 AM'},
  // Medios
  {id:'a-cont',     label:'Contenido',       cat:'media', hub:'h-media', tip:'Copy · captions · guiones'},
  {id:'a-yt',       label:'YouTube',         cat:'media', hub:'h-media', tip:'Tendencias · scraping'},
  {id:'a-ig',       label:'Instagram',       cat:'media', hub:'h-media', tip:'Publisher · posts automáticos'},
  {id:'a-pipe',     label:'Pipeline Video',  cat:'media', hub:'h-media', tip:'Video + redes sociales'},
  // Memoria
  {id:'a-ctx',      label:'contexto.py',     cat:'mem',   hub:'h-mem',   tip:'Últimos 30 turnos en contexto'},
  {id:'a-mem2',     label:'agente_memoria',  cat:'mem',   hub:'h-mem',   tip:'Sesiones · historial largo'},
  {id:'a-vozadap',  label:'Voz Adaptativa',  cat:'mem',   hub:'h-mem',   tip:'Perfil Esneyder / Yoana · pitch'},
  {id:'a-memui',    label:'memoria_ui',      cat:'mem',   hub:'h-mem',   tip:'Burbujas y presentación Telegram'},
  {id:'a-sesiones', label:'Gestión Sesiones',cat:'mem',   hub:'h-mem',   tip:'Sesiones nombradas · historial · retomar'},
  // Automatización
  {id:'a-bot24',    label:'Bot 24/7',        cat:'auto',  hub:'h-auto',  tip:'bot_autonomo · activo permanente'},
  {id:'a-sched',    label:'Task Scheduler',  cat:'auto',  hub:'h-auto',  tip:'Windows · tareas programadas'},
  {id:'a-brief',    label:'Briefing Diario', cat:'auto',  hub:'h-auto',  tip:'Resumen matutino 8 AM'},
  {id:'a-limpieza', label:'Limpieza Chat',   cat:'auto',  hub:'h-auto',  tip:'Reset automático 11:59 PM'},
];

const CROSS = [
  ['a-debate',   'a-groq',    'ia'],
  ['a-debate',   'a-claude',  'ia'],
  ['a-voz',      'a-tts',     'integ'],
  ['a-gh',       'a-henkel',  'rep'],
  ['a-drive',    'a-foto',    'canal'],
  ['a-sched',    'a-dolores', 'auto'],
  ['a-sesiones', 'a-mem2',    'mem'],
  ['a-pqpmon',   'a-bqllita', 'rep'],
  ['a-backup',   'a-drive',   'integ'],
  ['a-limpieza', 'a-sched',   'auto'],
];

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x020609, 1);
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const css2d = new CSS2DRenderer();
css2d.setSize(window.innerWidth, window.innerHeight);
css2d.domElement.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;z-index:5;overflow:hidden';
document.body.appendChild(css2d.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020609, 0.00028);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.5, 8000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 250;
controls.maxDistance = 2500;
controls.target.set(0, 0, 0);

function setCamDist() {
  const aspect = window.innerWidth / window.innerHeight;
  const halfVFov = Math.tan(THREE.MathUtils.degToRad(27.5));
  const R = 480;
  const D = aspect < 1 ? R / (halfVFov * aspect) : R / halfVFov;
  camera.position.set(0, D * 0.18, D * 1.15);
}
setCamDist();

// ── Luces ─────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x112244, 2.5));
const coreLight = new THREE.PointLight(0x00d4ff, 4, 1000);
scene.add(coreLight);
// Luces de categoría
[[0x7E57C2,300,100,0],[0x2196F3,-200,150,250],[0xFF6F00,250,-100,-200],
 [0x00C853,-300,-150,100],[0xF50057,100,200,-300],[0xAB47BC,-100,-200,250]]
.forEach(([col,x,y,z]) => {
  const l = new THREE.PointLight(col, 0.5, 700);
  l.position.set(x,y,z);
  scene.add(l);
});

// ── Estrellas ─────────────────────────────────────────────────────────────────
{
  const geo = new THREE.BufferGeometry();
  const n = 2000, pos = new Float32Array(n*3);
  for(let i=0;i<n*3;i++) pos[i]=(Math.random()-.5)*6000;
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:0x334466,size:1.5,sizeAttenuation:true})));
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const ORIGIN = new THREE.Vector3(0,0,0);

function fibSphere(n, r) {
  const pts = [], phi = Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = 1-(i/(n-1))*2;
    const rad = Math.sqrt(Math.max(0,1-y*y));
    const theta = phi*i;
    pts.push(new THREE.Vector3(Math.cos(theta)*rad*r, y*r, Math.sin(theta)*rad*r));
  }
  return pts;
}

function glowSprite(hexColor, size) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const r=(hexColor>>16)&255, g=(hexColor>>8)&255, b=hexColor&255;
  const gr = ctx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.35,`rgba(${r},${g},${b},0.45)`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(0,0,128,128);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c),
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
  }));
  sp.scale.setScalar(size);
  return sp;
}

function mkLine(p1, p2, hexColor, opacity) {
  const geo = new THREE.BufferGeometry().setFromPoints([p1,p2]);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({
    color:hexColor, opacity, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
}

function cssLbl(text, cls) {
  const d = document.createElement('div');
  d.className = cls || 'lbl';
  d.textContent = text;
  return new CSS2DObject(d);
}

// ── Mapa de nodos ─────────────────────────────────────────────────────────────
const nodeMap = {};
const clickable = [];

// ARIA centro
{
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(48, 36, 36),
    new THREE.MeshPhongMaterial({color:0x001830, emissive:0x00d4ff, emissiveIntensity:0.6, shininess:100})
  );
  scene.add(mesh);
  mesh.add(glowSprite(0x00d4ff, 240));

  // Anillo orbital
  const ring1 = new THREE.Mesh(
    new THREE.TorusGeometry(70, 1.8, 8, 90),
    new THREE.MeshBasicMaterial({color:0x00d4ff, opacity:0.35, transparent:true, blending:THREE.AdditiveBlending})
  );
  mesh.add(ring1);

  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(85, 1.2, 8, 90),
    new THREE.MeshBasicMaterial({color:0x0099bb, opacity:0.2, transparent:true, blending:THREE.AdditiveBlending})
  );
  ring2.rotation.x = Math.PI/4;
  mesh.add(ring2);

  const lbl = cssLbl('ARIA', 'lbl lbl-aria');
  lbl.position.set(0, 68, 0);
  mesh.add(lbl);

  mesh.userData = {ring1, ring2};
  nodeMap['aria'] = {mesh, pos:new THREE.Vector3(), data:{label:'ARIA', cat:'aria', tip:'Asistente de Respuesta Inteligente Automatizada · Synaptic Analytics'}};
  clickable.push(mesh);
}

// Hubs
const hubPts = fibSphere(HUBS.length, 278);
HUBS.forEach((hub, i) => {
  const p = hubPts[i];
  const col = C[hub.cat].hex;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(21, 24, 24),
    new THREE.MeshPhongMaterial({color:0x020609, emissive:col, emissiveIntensity:0.8, shininess:60})
  );
  mesh.position.copy(p);
  scene.add(mesh);
  mesh.add(glowSprite(col, 115));

  const lbl = cssLbl(hub.label, 'lbl lbl-hub');
  lbl.element.style.color = C[hub.cat].css;
  lbl.element.style.textShadow = `0 0 8px ${C[hub.cat].css}66`;
  lbl.position.set(0, 29, 0);
  mesh.add(lbl);

  nodeMap[hub.id] = {mesh, pos:p.clone(), data:{label:hub.label, cat:hub.cat, tip:`Hub · ${C[hub.cat].name}`}};
  clickable.push(mesh);

  scene.add(mkLine(ORIGIN, p, col, 0.55));
});

// Agentes
const byHub = {};
AGENTS.forEach(a => { (byHub[a.hub] || (byHub[a.hub]=[])).push(a); });

HUBS.forEach(hub => {
  const hubPos = nodeMap[hub.id].pos;
  const agents  = byHub[hub.id] || [];
  const col     = C[hub.cat].hex;
  const count   = agents.length;

  const hubDir = hubPos.clone().normalize();
  const tmpUp  = Math.abs(hubDir.y) < 0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
  const right  = new THREE.Vector3().crossVectors(hubDir, tmpUp).normalize();
  const fwd    = new THREE.Vector3().crossVectors(right, hubDir).normalize();

  agents.forEach((agent, i) => {
    const phi    = count > 1 ? (i/(count-1))*Math.PI*1.65 - Math.PI*0.825 : 0;
    const spread = count <= 2 ? 0.22 : count <= 4 ? 0.35 : 0.44;
    const altOff = (i % 3 - 1) * 0.12;

    const dir = hubDir.clone()
      .addScaledVector(right,  Math.cos(phi) * spread)
      .addScaledVector(fwd,    Math.sin(phi) * spread)
      .addScaledVector(new THREE.Vector3(0,1,0), altOff)
      .normalize()
      .multiplyScalar(438);

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(10, 14, 14),
      new THREE.MeshPhongMaterial({color:0x020609, emissive:col, emissiveIntensity:0.65, shininess:40})
    );
    mesh.position.copy(dir);
    scene.add(mesh);
    mesh.add(glowSprite(col, 50));

    nodeMap[agent.id] = {mesh, pos:dir.clone(), data:agent};
    clickable.push(mesh);
    scene.add(mkLine(hubPos, dir, col, 0.22));
  });
});

// Cross-links
CROSS.forEach(([from, to, cat]) => {
  const pf = nodeMap[from]?.pos, pt = nodeMap[to]?.pos;
  if(pf && pt) scene.add(mkLine(pf, pt, C[cat].hex, 0.4));
});

// ── Partículas en conexiones ARIA→Hub ─────────────────────────────────────────
const particles = HUBS.map((hub, i) => {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(3.5, 8, 8),
    new THREE.MeshBasicMaterial({color:C[hub.cat].hex, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false})
  );
  scene.add(mesh);
  return {mesh, to:nodeMap[hub.id].pos.clone(), t:i/HUBS.length, spd:0.004+i*0.0003};
});

// ── Raycasting ────────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
raycaster.params.Line = {threshold: 3};
const ptr = new THREE.Vector2();
let ptDown = null, dragDist = 0;

renderer.domElement.addEventListener('pointerdown', e => {
  ptDown = {x:e.clientX, y:e.clientY}; dragDist = 0;
});
renderer.domElement.addEventListener('pointermove', e => {
  if(ptDown) dragDist += Math.hypot(e.clientX-ptDown.x, e.clientY-ptDown.y);
});
renderer.domElement.addEventListener('pointerup', e => {
  if(dragDist < 10 && ptDown) {
    ptr.x = (e.clientX/window.innerWidth)*2-1;
    ptr.y = -(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(ptr, camera);
    const hits = raycaster.intersectObjects(clickable, false);
    if(hits.length) {
      const entry = Object.values(nodeMap).find(n => n.mesh === hits[0].object);
      if(entry) showTip(entry.data);
    } else {
      hideTip();
    }
  }
  ptDown = null;
});

function showTip(data) {
  document.getElementById('tn').textContent = data.label;
  document.getElementById('td').textContent = data.tip || '';
  document.getElementById('tc').textContent = C[data.cat]?.name || '';
  document.getElementById('tooltip').style.display = 'block';
  document.getElementById('hint').style.display = 'none';
}
function hideTip() { document.getElementById('tooltip').style.display = 'none'; }

// ── UI ────────────────────────────────────────────────────────────────────────
let autoRot = true;
window.toggleRot = () => {
  autoRot = !autoRot;
  controls.autoRotate = autoRot;
  document.getElementById('btn-rot').textContent = autoRot ? '⟳ Auto' : '⟳ Libre';
};
window.resetCam = () => {
  setCamDist();
  controls.target.set(0,0,0);
  controls.autoRotate = autoRot = true;
  document.getElementById('btn-rot').textContent = '⟳ Auto';
  hideTip();
};

// Leyenda
const leg = document.getElementById('legend');
Object.entries(C).filter(([k])=>k!=='aria').forEach(([k,v]) => {
  const el = document.createElement('div');
  el.className = 'li';
  el.innerHTML = `<div class="ld" style="background:${v.css}"></div>${v.name}`;
  leg.appendChild(el);
});

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  css2d.setSize(window.innerWidth, window.innerHeight);
});

// ── Loop de animación ─────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let frame = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  frame++;

  // ARIA
  const aria = nodeMap['aria'].mesh;
  aria.material.emissiveIntensity = 0.5 + Math.sin(t*2.1)*0.2;
  aria.userData.ring1.rotation.y = t * 0.5;
  aria.userData.ring1.rotation.z = Math.sin(t*0.4)*0.3;
  aria.userData.ring2.rotation.y = -t * 0.3;
  aria.userData.ring2.rotation.x = Math.PI/4 + Math.sin(t*0.2)*0.2;
  coreLight.intensity = 3.5 + Math.sin(t*1.8)*1.0;

  // Hubs (cada 3 frames para ahorrar cálculo)
  if(frame % 3 === 0) {
    HUBS.forEach((hub, i) => {
      nodeMap[hub.id].mesh.material.emissiveIntensity = 0.65 + Math.sin(t*1.4+i*0.9)*0.25;
    });
  }

  // Agentes (cada 4 frames)
  if(frame % 4 === 0) {
    AGENTS.forEach((a, i) => {
      const n = nodeMap[a.id];
      if(n) n.mesh.material.emissiveIntensity = 0.45 + Math.sin(t*1.1+i*0.5)*0.2;
    });
  }

  // Partículas
  particles.forEach(p => {
    p.t = (p.t + p.spd) % 1;
    p.mesh.position.lerpVectors(ORIGIN, p.to, p.t);
    p.mesh.material.opacity = Math.sin(p.t * Math.PI) * 0.9;
  });

  controls.update();
  renderer.render(scene, camera);
  css2d.render(scene, camera);
}
animate();
</script>
</body>
</html>
