<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA — Red Neuronal Sináptica</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050810;overflow:hidden;font-family:'Segoe UI',sans-serif;width:100vw;height:100vh}
#canvas-wrap{position:relative;width:100%;height:100%;overflow:hidden}
canvas#bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
svg#net{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;overflow:visible}
#nodes{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2}

/* ARIA center */
.aria-wrap{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:10}
.aria-ring{width:200px;height:200px;border-radius:50%;border:2px solid rgba(0,180,255,0.6);
  box-shadow:0 0 40px #00bfff,0 0 80px rgba(0,120,255,0.4),inset 0 0 40px rgba(0,80,200,0.3);
  animation:aria-pulse 3s ease-in-out infinite;overflow:hidden;position:relative}
.aria-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;filter:saturate(1.2) contrast(1.05)}
.aria-ring::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,transparent 60%,rgba(0,80,200,0.25) 100%)}
.aria-label{text-align:center;margin-top:10px;color:#00d4ff;font-size:13px;font-weight:700;
  letter-spacing:3px;text-shadow:0 0 10px #00bfff;text-transform:uppercase}
.aria-sub{text-align:center;color:rgba(140,200,255,0.7);font-size:9px;letter-spacing:2px;margin-top:2px}
@keyframes aria-pulse{0%,100%{box-shadow:0 0 40px #00bfff,0 0 80px rgba(0,120,255,0.4)}
  50%{box-shadow:0 0 60px #00d4ff,0 0 120px rgba(0,160,255,0.6),0 0 200px rgba(0,100,255,0.2)}}

/* Hub nodes */
.hub{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;z-index:5}
.hub-circle{border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:0 auto;font-size:18px;transition:all .3s;animation:hub-float 4s ease-in-out infinite}
.hub-circle:hover{transform:scale(1.2);filter:brightness(1.4)}
.hub-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  margin-top:5px;opacity:0.9}
@keyframes hub-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* Agent nodes */
.agent{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;z-index:4}
.agent-pill{border-radius:20px;padding:4px 10px;font-size:8.5px;font-weight:600;
  letter-spacing:0.8px;white-space:nowrap;transition:all .25s;border:1px solid;
  backdrop-filter:blur(4px)}
.agent-pill:hover{transform:scale(1.12);filter:brightness(1.5);z-index:20}
.agent-icon{font-size:10px;margin-right:3px}

/* SVG connections */
.link{fill:none;stroke-width:1.2;opacity:0.5}
.link-main{stroke-width:1.8;opacity:0.65}
.link-pulse{stroke-dasharray:6,8;animation:flow 3s linear infinite}
.link-pulse2{stroke-dasharray:4,10;animation:flow 4s linear infinite reverse}
@keyframes flow{to{stroke-dashoffset:-100}}

/* Tooltip */
#tip{position:fixed;background:rgba(5,15,40,0.95);border:1px solid rgba(0,180,255,0.4);
  border-radius:8px;padding:8px 14px;font-size:11px;color:#cce8ff;pointer-events:none;
  display:none;z-index:100;max-width:220px;box-shadow:0 0 20px rgba(0,120,255,0.3)}

/* Title */
#title{position:fixed;top:18px;left:50%;transform:translateX(-50%);text-align:center;z-index:50}
#title h1{font-size:14px;color:#00d4ff;letter-spacing:4px;font-weight:300;text-transform:uppercase;
  text-shadow:0 0 20px rgba(0,200,255,0.8)}
#title p{font-size:9px;color:rgba(100,160,220,0.6);letter-spacing:2px;margin-top:3px}

/* Controls */
#ctrl{position:fixed;bottom:16px;right:16px;display:flex;gap:8px;z-index:50}
#ctrl button{background:rgba(0,30,80,0.8);border:1px solid rgba(0,150,255,0.4);color:#88ccff;
  padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:all .2s}
#ctrl button:hover{background:rgba(0,60,160,0.8);border-color:#00bfff}

/* Legend */
#legend{position:fixed;bottom:16px;left:16px;z-index:50;display:flex;flex-wrap:wrap;gap:6px;max-width:420px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:9px;color:rgba(160,200,240,0.7)}
.leg-dot{width:8px;height:8px;border-radius:50%}
</style>
</head>

const bgCanvas = document.getElementById('bg');
const ctx = bgCanvas.getContext('2d');
bgCanvas.width = W; bgCanvas.height = H;
const particles = Array.from({length:120},()=>({
  x:Math.random()*W, y:Math.random()*H,
  r:Math.random()*1.2+0.3,
  a:Math.random()*Math.PI*2,
  s:Math.random()*0.3+0.1,
  op:Math.random()*0.4+0.1,
}));

function drawBg(){
  ctx.clearRect(0,0,W,H);
  // Gradient background
  const gr = ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*0.7);
  gr.addColorStop(0,'#0A1428'); gr.addColorStop(1,'#030508');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  // Particles
  particles.forEach(p=>{
    p.x+=Math.cos(p.a)*p.s; p.y+=Math.sin(p.a)*p.s;
    if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=gba(80,160,255,); ctx.fill();
  });
  requestAnimationFrame(drawBg);
}
drawBg();

function mkGrad(id,c1,c2){
  const d = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
  d.id=id; d.setAttribute('gradientUnits','userSpaceOnUse');
  const s1=document.createElementNS('http://www.w3.org/2000/svg','stop');
  s1.setAttribute('offset','0%'); s1.setAttribute('stop-color',c1);
  const s2=document.createElementNS('http://www.w3.org/2000/svg','stop');
  s2.setAttribute('offset','100%'); s2.setAttribute('stop-color',c2);
  d.appendChild(s1); d.appendChild(s2);
  return d;
}

// ── Zoom / pan ────────────────────────────────────────────────────────────────
let scale=1, tx=0, ty=0;
const wrap=document.getElementById('nodes');
const svgEl=document.getElementById('net');
function applyT(){
  [wrap,svgEl].forEach(el=>el.style.transform=	ranslate(px,px) scale());
  [wrap,svgEl].forEach(el=>el.style.transformOrigin=${CX}px px);
}
function zoom(d){scale=Math.max(0.4,Math.min(2.5,scale+d));applyT()}
function resetView(){scale=1;tx=0;ty=0;applyT()}

// Drag
let drag=false,sx=0,sy=0,stx=0,sty=0;
document.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty});
document.addEventListener('mousemove',e=>{if(drag){tx=stx+(e.clientX-sx);ty=sty+(e.clientY-sy);applyT()}});
document.addEventListener('mouseup',()=>drag=false);
document.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?0.1:-0.1)},{passive:false});
