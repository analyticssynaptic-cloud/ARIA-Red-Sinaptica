}

#vid-overlay{
  position:fixed;inset:0;z-index:1;
  background:rgba(2,6,18,0.42);
}

  box-shadow:0 4px 24px rgba(0,180,255,.18)}

#tooltip .sub{font-size:10.5px;opacity:.8;line-height:1.5}
#tooltip .cat{font-size:9px;opacity:.45;margin-top:7px;letter-spacing:1.5px;text-transform:uppercase}
#hint{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);color:rgba(100,160,210,.5);
  font-size:10px;letter-spacing:1px;z-index:10;pointer-events:none;animation:fadeout 4s 3s forwards}
@keyframes fadeout{to{opacity:0}}
#legend{position:fixed;bottom:16px;left:12px;z-index:10;display:flex;flex-wrap:wrap;gap:3px 10px;max-width:200px}
.li{display:flex;align-items:center;gap:4px;font-size:7px;color:rgba(140,185,225,.55)}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0}
#ctrl{position:fixed;bottom:16px;right:12px;z-index:10;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#ctrl button{background:rgba(0,10,40,.82);border:1px solid rgba(0,150,255,.38);color:#88ccff;
  padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;backdrop-filter:blur(6px)}
#ctrl button:active{background:rgba(0,60,160,.85)}
#ctrl button.active{border-color:rgba(0,220,255,.8);color:#00d4ff}
.lbl{color:#fff;font-size:9px;padding:2px 6px;background:rgba(0,0,0,.45);border-radius:4px;pointer-events:none;white-space:nowrap;user-select:none}
.lbl-hub{font-size:10.5px;font-weight:600;padding:3px 8px}
#play-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;cursor:pointer}
#play-ov svg{width:64px;height:64px;fill:#00d4ff;filter:drop-shadow(0 0 16px #00d4ff)}
#play-ov p{color:#00d4ff;font-size:13px;letter-spacing:3px}
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

// ── Video autoplay ────────────────────────────────────────────────────────────
const vid=document.getElementById('av-vid');
const playOv=document.getElementById('play-ov');
function startVideo(){
  vid.play().then(()=>{playOv.style.display='none';}).catch(()=>{});
}
startVideo();
playOv.addEventListener('click',()=>{vid.play();playOv.style.display='none';},{once:true});

// ── Renderer Three.js (alpha=true → canvas transparente sobre el video) ──────
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x000000,0); // transparente — el video se ve debajo
renderer.domElement.style.cssText='position:fixed;inset:0;z-index:2;';
document.body.appendChild(renderer.domElement);

const css2d=new CSS2DRenderer();
css2d.setSize(window.innerWidth,window.innerHeight);
css2d.domElement.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:5;overflow:hidden';
document.body.appendChild(css2d.domElement);

const scene=new THREE.Scene();
// Sin fog (con canvas transparente el fog se ve raro)
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.5,8000);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.07;
controls.autoRotate=true;controls.autoRotateSpeed=0.45;
controls.minDistance=180;controls.maxDistance=2200;

const CAM_WIDE={pos:new THREE.Vector3(0,80,920),tgt:new THREE.Vector3(0,0,0)};
const CAM_ZOOM={pos:new THREE.Vector3(0,60,480),tgt:new THREE.Vector3(0,0,0)};
let camGoal=null;

function setCamDist(){
  const a=window.innerWidth/window.innerHeight,hv=Math.tan(THREE.MathUtils.degToRad(25));
  const D=a<1?440/(hv*a):440/hv;
  camera.position.set(0,D*0.12,D*1.1);
  controls.target.set(0,0,0);controls.update();
}
setCamDist();

scene.add(new THREE.AmbientLight(0x112244,2.0));
const coreLight=new THREE.PointLight(0x00d4ff,4,900);scene.add(coreLight);
[[0x7E57C2,300,100,0],[0x2196F3,-200,150,250],[0xFF6F00,250,-100,-200],
 [0x00C853,-300,-150,100],[0xF50057,100,200,-300],[0xAB47BC,-100,-200,250]]
.forEach(([c,x,y,z])=>{const l=new THREE.PointLight(c,0.4,650);l.position.set(x,y,z);scene.add(l);});

// ── Core ARIA en el centro (glow + anillos, sin plano de video) ───────────────
function glowSprite(col,size){
  const c=document.createElement('canvas');c.width=c.height=128;
  const ctx=c.getContext('2d'),r=(col>>16)&255,g=(col>>8)&255,b=col&255;
  const gr=ctx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.4,`rgba(${r},${g},${b},.4)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,128,128);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.scale.setScalar(size);return sp;
}

// Glow suave en el centro para marcar el core
const coreGlow=glowSprite(0x00d4ff,180);
coreGlow.position.set(0,0,0);
scene.add(coreGlow);

// Anillos orbitales del core
const rings=[];
[[72,1.8,0x00d4ff,.35],[96,1.2,0x0088cc,.2],[120,0.8,0x005588,.12]].forEach(([r,t,col,op],i)=>{
  const rm=new THREE.Mesh(new THREE.TorusGeometry(r,t,8,90),
    new THREE.MeshBasicMaterial({color:col,opacity:op,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  if(i===1)rm.rotation.x=Math.PI/3;
  if(i===2)rm.rotation.x=Math.PI/6;rm.rotation.y=Math.PI/4;
  scene.add(rm);rings.push(rm);
});

// Esfera invisible en el centro para el raycaster del nodo ARIA
const coreHit=new THREE.Mesh(new THREE.SphereGeometry(55,8,8),
  new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
scene.add(coreHit);

// ── Helpers ───────────────────────────────────────────────────────────────────
const ORIGIN=new THREE.Vector3();
function fibSphere(n,r){
  const pts=[],phi=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,rad=Math.sqrt(Math.max(0,1-y*y)),t=phi*i;
    pts.push(new THREE.Vector3(Math.cos(t)*rad*r,y*r,Math.sin(t)*rad*r));}
  return pts;
}
function emojiLabel(emoji,css,fs){
  const d=document.createElement('div');
  d.style.cssText=`font-size:${fs||18}px;line-height:1;pointer-events:none;user-select:none;text-shadow:0 0 6px ${css}88;filter:drop-shadow(0 0 3px ${css})`;
  d.textContent=emoji;return new CSS2DObject(d);
}
function mkLine(p1,p2,col,op){
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]),
    new THREE.LineBasicMaterial({color:col,opacity:op,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
}
function cssLbl(text,cls){
  const d=document.createElement('div');d.className=cls||'lbl';d.textContent=text;return new CSS2DObject(d);
}

// ── Datos nodos ───────────────────────────────────────────────────────────────
const C={
  aria:{hex:0x00d4ff,css:'#00d4ff',name:'ARIA Core'},
  ia:  {hex:0x7E57C2,css:'#7E57C2',name:'Stack IA'},
  canal:{hex:0x2196F3,css:'#2196F3',name:'Canales'},
  agent:{hex:0xFF6F00,css:'#FF6F00',name:'Agentes'},
  rep: {hex:0xFFD600,css:'#FFD600',name:'Reportes'},
  integ:{hex:0x26C6DA,css:'#26C6DA',name:'Integraciones'},
  media:{hex:0x00C853,css:'#00C853',name:'Medios'},
  mem: {hex:0xF50057,css:'#F50057',name:'Memoria'},
  auto:{hex:0xAB47BC,css:'#AB47BC',name:'Automatización'},
};
const HUBS=[
  {id:'h-ia',    label:'Stack IA',   cat:'ia',    icon:'🧠'},
  {id:'h-canal', label:'Canales',    cat:'canal', icon:'📱'},
  {id:'h-agent', label:'Agentes',    cat:'agent', icon:'⚙️'},
  {id:'h-rep',   label:'Reportes',   cat:'rep',   icon:'📊'},
  {id:'h-integ', label:'Integrac.',  cat:'integ', icon:'🔗'},
  {id:'h-media', label:'Medios',     cat:'media', icon:'🎬'},
  {id:'h-mem',   label:'Memoria',    cat:'mem',   icon:'🧬'},
  {id:'h-auto',  label:'Automatiz.', cat:'auto',  icon:'⏰'},
];
const AGENTS=[
  {id:'a-ollama',label:'Ollama',cat:'ia',hub:'h-ia',tip:'qwen2.5 local',icon:'🤖'},
  {id:'a-groq',label:'Groq',cat:'ia',hub:'h-ia',tip:'LLaMA 3.3',icon:'⚡'},
  {id:'a-claude',label:'Claude',cat:'ia',hub:'h-ia',tip:'Anthropic 4.6',icon:'✨'},
  {id:'a-tg',label:'Telegram',cat:'canal',hub:'h-canal',tip:'sendVoice · fotos',icon:'✈️'},
  {id:'a-voz',label:'STT',cat:'canal',hub:'h-canal',tip:'Whisper · OGG',icon:'🎙️'},
  {id:'a-foto',label:'Fotos',cat:'canal',hub:'h-canal',tip:'→ Drive auto',icon:'📷'},
  {id:'a-calcu',label:'Calc',cat:'agent',hub:'h-agent',tip:'Cálculos locales',icon:'🧮'},
  {id:'a-clima',label:'Clima',cat:'agent',hub:'h-agent',tip:'Tiempo real',icon:'🌤️'},
  {id:'a-notic',label:'Noticias',cat:'agent',hub:'h-agent',tip:'Titulares',icon:'📰'},
  {id:'a-rec',label:'Recordatorios',cat:'agent',hub:'h-agent',tip:'Alarmas',icon:'⏰'},
  {id:'a-juegos',label:'Juegos',cat:'agent',hub:'h-agent',tip:'Steam',icon:'🎮'},
  {id:'a-empleo',label:'Empleos',cat:'agent',hub:'h-agent',tip:'Ofertas activas',icon:'💼'},
  {id:'a-debate',label:'Debate',cat:'rep',hub:'h-rep',tip:'Claude vs Groq',icon:'⚔️'},
  {id:'a-pdf',label:'PDF',cat:'rep',hub:'h-rep',tip:'fpdf2',icon:'📄'},
  {id:'a-dolores',label:'Dolores',cat:'rep',hub:'h-rep',tip:'Ventas lunes',icon:'📈'},
  {id:'a-henkel',label:'Henkel',cat:'rep',hub:'h-rep',tip:'GitHub Pages',icon:'🧴'},
  {id:'a-campana',label:'Campañas',cat:'rep',hub:'h-rep',tip:'Análisis activos',icon:'📣'},
  {id:'a-pqpmon',label:'PQP Mon',cat:'rep',hub:'h-rep',tip:'PDVs · 8 PM',icon:'🏪'},
  {id:'a-bqllita',label:'Barranquillita',cat:'rep',hub:'h-rep',tip:'Informe PQP IV',icon:'🌊'},
  {id:'a-drive',label:'Drive',cat:'integ',hub:'h-integ',tip:'OAuth · CLASP',icon:'☁️'},
  {id:'a-gh',label:'GitHub',cat:'integ',hub:'h-integ',tip:'Pages · deploy',icon:'🐙'},
  {id:'a-tts',label:'Edge TTS',cat:'integ',hub:'h-integ',tip:'SalomeNeural',icon:'🔊'},
  {id:'a-stt2',label:'Whisper',cat:'integ',hub:'h-integ',tip:'Audio → texto',icon:'👂'},
  {id:'a-backup',label:'Backup',cat:'integ',hub:'h-integ',tip:'Respaldo 2 AM',icon:'💾'},
  {id:'a-cont',label:'Contenido',cat:'media',hub:'h-media',tip:'Copy · guiones',icon:'✍️'},
  {id:'a-yt',label:'YouTube',cat:'media',hub:'h-media',tip:'Tendencias',icon:'▶️'},
  {id:'a-ig',label:'Instagram',cat:'media',hub:'h-media',tip:'Posts auto',icon:'📸'},
  {id:'a-pipe',label:'Pipeline',cat:'media',hub:'h-media',tip:'Video + redes',icon:'🎞️'},
  {id:'a-avatar',label:'Avatar 3D',cat:'media',hub:'h-media',tip:'Tron · Three.js',icon:'🧊'},
  {id:'a-ctx',label:'contexto.py',cat:'mem',hub:'h-mem',tip:'30 turnos',icon:'💭'},
  {id:'a-mem2',label:'Memoria',cat:'mem',hub:'h-mem',tip:'Sesiones largas',icon:'🗄️'},
  {id:'a-vozadap',label:'Voz Adapt',cat:'mem',hub:'h-mem',tip:'Esneyder/Yoana',icon:'🎵'},
  {id:'a-memui',label:'Mem UI',cat:'mem',hub:'h-mem',tip:'Telegram bubbles',icon:'💬'},
  {id:'a-sesiones',label:'Sesiones',cat:'mem',hub:'h-mem',tip:'Historial',icon:'🗂️'},
  {id:'a-bot24',label:'Bot 24/7',cat:'auto',hub:'h-auto',tip:'Permanente',icon:'🔄'},
  {id:'a-sched',label:'Scheduler',cat:'auto',hub:'h-auto',tip:'Tareas Windows',icon:'📅'},
  {id:'a-brief',label:'Briefing',cat:'auto',hub:'h-auto',tip:'8 AM diario',icon:'☀️'},
  {id:'a-limpieza',label:'Limpieza',cat:'auto',hub:'h-auto',tip:'11:59 PM reset',icon:'🧹'},
];
const CROSS=[
  ['a-debate','a-groq','ia'],['a-debate','a-claude','ia'],['a-voz','a-tts','integ'],
  ['a-gh','a-henkel','rep'],['a-drive','a-foto','canal'],['a-sched','a-dolores','auto'],
  ['a-sesiones','a-mem2','mem'],['a-pqpmon','a-bqllita','rep'],['a-backup','a-drive','integ'],
  ['a-limpieza','a-sched','auto'],['a-avatar','a-ig','media'],
];

// ── Nodos ─────────────────────────────────────────────────────────────────────
const nodeMap={};
const clickable=[coreHit];
nodeMap['aria']={mesh:coreHit,pos:ORIGIN.clone(),data:{label:'ARIA',cat:'aria',tip:'Asistente de Respuesta Inteligente Automatizada · Avatar 3D Tron · Synaptic Analytics'}};

const hubPts=fibSphere(HUBS.length,290);
HUBS.forEach((hub,i)=>{
  const p=hubPts[i],col=C[hub.cat].hex;
  // Nodos semi-transparentes
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(22,24,24),
    new THREE.MeshPhongMaterial({color:0x020609,emissive:col,emissiveIntensity:.9,
      shininess:60,transparent:true,opacity:0.82}));
  mesh.position.copy(p);scene.add(mesh);
  mesh.add(glowSprite(col,110));
  const icon=emojiLabel(hub.icon,C[hub.cat].css,20);icon.position.set(0,-4,0);mesh.add(icon);
  const lbl=cssLbl(hub.label,'lbl lbl-hub');
  lbl.element.style.color=C[hub.cat].css;lbl.element.style.textShadow=`0 0 8px ${C[hub.cat].css}66`;
  lbl.position.set(0,32,0);mesh.add(lbl);
  nodeMap[hub.id]={mesh,pos:p.clone(),data:{label:hub.label,cat:hub.cat,tip:`Hub · ${C[hub.cat].name}`}};
  clickable.push(mesh);
  scene.add(mkLine(ORIGIN,p,col,.45));
});

const byHub={};AGENTS.forEach(a=>{(byHub[a.hub]||(byHub[a.hub]=[])).push(a);});
HUBS.forEach(hub=>{
  const hubPos=nodeMap[hub.id].pos,agents=byHub[hub.id]||[],col=C[hub.cat].hex,count=agents.length;
  const hd=hubPos.clone().normalize();
  const tu=Math.abs(hd.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const right=new THREE.Vector3().crossVectors(hd,tu).normalize();
  const fwd=new THREE.Vector3().crossVectors(right,hd).normalize();
  agents.forEach((agent,i)=>{
    const phi=count>1?(i/(count-1))*Math.PI*1.65-Math.PI*.825:0;
    const sp=count<=2?.22:count<=4?.35:.44;
    const dir=hd.clone().addScaledVector(right,Math.cos(phi)*sp).addScaledVector(fwd,Math.sin(phi)*sp)
      .addScaledVector(new THREE.Vector3(0,1,0),(i%3-1)*.12).normalize().multiplyScalar(455);
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(10,14,14),
      new THREE.MeshPhongMaterial({color:0x020609,emissive:col,emissiveIntensity:.7,
        shininess:40,transparent:true,opacity:0.75}));
    mesh.position.copy(dir);scene.add(mesh);
    mesh.add(glowSprite(col,50));
    if(agent.icon){const aIcon=emojiLabel(agent.icon,C[agent.cat].css,13);aIcon.position.set(0,-2,0);mesh.add(aIcon);}
    nodeMap[agent.id]={mesh,pos:dir.clone(),data:agent};clickable.push(mesh);
    scene.add(mkLine(hubPos,dir,col,.18));
  });
});
CROSS.forEach(([f,t,cat])=>{const pf=nodeMap[f]?.pos,pt=nodeMap[t]?.pos;if(pf&&pt)scene.add(mkLine(pf,pt,C[cat].hex,.35));});

const particles=HUBS.map((hub,i)=>{
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(3.5,8,8),
    new THREE.MeshBasicMaterial({color:C[hub.cat].hex,transparent:true,opacity:0,
      blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(mesh);
  return{mesh,to:nodeMap[hub.id].pos.clone(),t:i/HUBS.length,spd:.004+i*.0003};
});

// ── Raycaster ─────────────────────────────────────────────────────────────────
const raycaster=new THREE.Raycaster();const ptr=new THREE.Vector2();
let ptDown=null,dragDist=0;
renderer.domElement.addEventListener('pointerdown',e=>{ptDown={x:e.clientX,y:e.clientY};dragDist=0;});
renderer.domElement.addEventListener('pointermove',e=>{if(ptDown)dragDist+=Math.hypot(e.clientX-ptDown.x,e.clientY-ptDown.y);});
renderer.domElement.addEventListener('pointerup',e=>{
  if(dragDist<10&&ptDown){
    ptr.x=(e.clientX/window.innerWidth)*2-1;ptr.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(ptr,camera);
    const hits=raycaster.intersectObjects(clickable,false);
    if(hits.length){const en=Object.values(nodeMap).find(n=>n.mesh===hits[0].object);if(en)showTip(en.data);}
    else hideTip();
    if(playOv.style.display!=='none'){vid.play();playOv.style.display='none';}
  }ptDown=null;
});
function showTip(d){
  document.getElementById('tn').textContent=d.label;
  document.getElementById('td').textContent=d.tip||'';
  document.getElementById('tc').textContent=C[d.cat]?.name||'';
  document.getElementById('tooltip').style.display='block';
  document.getElementById('hint').style.display='none';
}
function hideTip(){document.getElementById('tooltip').style.display='none';}

// ── UI handlers ───────────────────────────────────────────────────────────────
let autoRot=true;
window.toggleRot=()=>{autoRot=!autoRot;controls.autoRotate=autoRot;document.getElementById('btn-rot').textContent=autoRot?'⟳ Auto':'⟳ Libre';};
window.camWide=()=>{camGoal={pos:CAM_WIDE.pos.clone(),tgt:CAM_WIDE.tgt.clone()};};
window.camZoom=()=>{camGoal={pos:CAM_ZOOM.pos.clone(),tgt:CAM_ZOOM.tgt.clone()};controls.autoRotate=false;};
window.resetCam=()=>{setCamDist();controls.autoRotate=autoRot=true;document.getElementById('btn-rot').textContent='⟳ Auto';camGoal=null;hideTip();};

const leg=document.getElementById('legend');
Object.entries(C).filter(([k])=>k!=='aria').forEach(([k,v])=>{
  const el=document.createElement('div');el.className='li';
  el.innerHTML=`<div class="ld" style="background:${v.css}"></div>${v.name}`;leg.appendChild(el);
});
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);css2d.setSize(window.innerWidth,window.innerHeight);
});

// ── Animación ─────────────────────────────────────────────────────────────────
const clock=new THREE.Clock();let frame=0;

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  frame++;

  if(camGoal){
    camera.position.lerp(camGoal.pos,0.035);
    controls.target.lerp(camGoal.tgt,0.035);
    if(camera.position.distanceTo(camGoal.pos)<3)camGoal=null;
  }

  // Anillos del core
  rings[0].rotation.y=t*.5;rings[0].rotation.z=Math.sin(t*.4)*.3;
  rings[1].rotation.y=-t*.3;rings[1].rotation.x=Math.PI/3+Math.sin(t*.2)*.2;
  rings[2].rotation.y=t*.2;rings[2].rotation.z=Math.sin(t*.35)*.15;
  coreLight.intensity=3.5+Math.sin(t*1.8)*1.2;

  // Pulso del glow central
  coreGlow.scale.setScalar(1+Math.sin(t*1.4)*.08);

  if(frame%3===0)HUBS.forEach((h,i)=>{nodeMap[h.id].mesh.material.emissiveIntensity=.72+Math.sin(t*1.4+i*.9)*.22;});
  if(frame%4===0)AGENTS.forEach((a,i)=>{const n=nodeMap[a.id];if(n)n.mesh.material.emissiveIntensity=.52+Math.sin(t*1.1+i*.5)*.18;});
  particles.forEach(p=>{p.t=(p.t+p.spd)%1;p.mesh.position.lerpVectors(ORIGIN,p.to,p.t);p.mesh.material.opacity=Math.sin(p.t*Math.PI)*.85;});

  controls.update();
  renderer.render(scene,camera);
  css2d.render(scene,camera);
}
animate();
</script>
</body></html>
