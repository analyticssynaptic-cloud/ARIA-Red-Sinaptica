<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>ARIA — Red Neuronal 3D</title>
<style>
:root{--cy:#00d4ff;--txt:#d6ecff;--muted:rgba(150,195,235,.62)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:var(--txt);touch-action:none;-webkit-tap-highlight-color:transparent}

/* ── Video: intro + bucle. El bucle empieza en el MISMO cuadro con que termina la intro,
      así el cambio es un corte directo (sin fundido que superponga dos imágenes) ── */
#stage{position:fixed;inset:0;z-index:0;transition:filter 1.2s ease,transform 1.4s ease}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#va{z-index:2}#vb{z-index:1}
#va.gone{visibility:hidden}
/* respiración muy leve encima del bucle, con un ritmo distinto (9.4 s vs 7 s del video)
   para que la espera nunca se sienta repetida; empieza en escala 1 → no se nota el corte */
#vb.idle{animation:breathe 9.4s ease-in-out infinite;transform-origin:49% 22%;will-change:transform}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(1.014) translateY(-.25%)}}
body.net #stage{filter:blur(10px) brightness(.26) saturate(1.3);transform:scale(1.08)}

/* ── Textos tipo transparencia sobre ARIA (sin tarjetas) ── */
#lines{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:12;width:min(92vw,640px);height:4.2em;pointer-events:none;text-align:center;
  transition:opacity .8s}
#lines .ln{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  opacity:0;transform:translateY(10px);filter:blur(6px);
  transition:opacity 1.1s ease,transform 1.4s cubic-bezier(.2,.7,.2,1),filter 1.1s ease}
#lines .ln.show{opacity:1;transform:none;filter:none}
#lines .ln.out{opacity:0;transform:translateY(-10px);filter:blur(6px)}
#lines .k{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:rgba(0,212,255,.85);
  text-shadow:0 0 12px rgba(0,212,255,.7),0 1px 6px #000}
#lines .t{margin-top:6px;font-size:clamp(15px,2.1vw,21px);font-weight:300;letter-spacing:.6px;line-height:1.35;
  color:rgba(236,248,255,.92);text-shadow:0 0 18px rgba(0,180,255,.45),0 1px 10px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.8)}
body.net #lines,body.pan #lines{opacity:0}

/* ── Textos laterales mientras ARIA habla en la intro ── */
.side{position:fixed;top:50%;z-index:12;width:min(30vw,340px);pointer-events:none;
  opacity:0;filter:blur(8px);transition:opacity 1s ease,transform 1.5s cubic-bezier(.2,.7,.2,1),filter 1s ease}
.side.l{left:max(4vw,18px);text-align:left;transform:translate(-24px,-50%)}
.side.r{right:max(4vw,18px);text-align:right;transform:translate(24px,-50%)}
.side.show{opacity:1;filter:none;transform:translate(0,-50%)}
.side .k{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:rgba(0,212,255,.9);
  text-shadow:0 0 14px rgba(0,212,255,.7),0 1px 6px #000}
.side .t{margin-top:8px;font-size:clamp(16px,2vw,24px);font-weight:300;line-height:1.3;letter-spacing:.4px;
  color:rgba(240,250,255,.92);text-shadow:0 0 20px rgba(0,180,255,.45),0 1px 10px rgba(0,0,0,.95)}
.side::before{content:'';display:block;width:38px;height:1px;margin-bottom:12px;
  background:linear-gradient(90deg,rgba(0,212,255,.9),transparent);box-shadow:0 0 8px rgba(0,212,255,.8)}
.side.r::before{margin-left:auto;background:linear-gradient(270deg,rgba(0,212,255,.9),transparent)}
@media (max-width:600px){
  .side{top:auto;bottom:calc(120px + env(safe-area-inset-bottom));width:52vw}
  .side.l{transform:translate(-16px,0)}.side.r{transform:translate(16px,0)}
  .side.show{transform:none}
  .side .t{font-size:14px}
}
#vign{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 30%,transparent 40%,rgba(0,4,14,.6) 100%)}
#gl{position:fixed;inset:0;z-index:2}
#labels{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}

/* ── Nodos (HTML sobre la escena 3D) ── */
.node{position:relative;border-radius:50%;pointer-events:auto;cursor:pointer;display:flex;
  align-items:center;justify-content:center;user-select:none}
.node.off{pointer-events:none}
.node .ic{display:flex;color:#f2fbff;filter:drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 1px rgba(0,0,0,.6));transition:transform .25s}
.node .ic svg{width:20px;height:20px;stroke-width:1.9}
.node.agent .ic svg{width:11px;height:11px;stroke-width:2.3}
.mini,#pclose{display:inline-flex;align-items:center;gap:6px}
.mini svg{width:14px;height:14px}
#pclose svg{width:17px;height:17px}
#panel .pic svg{width:24px;height:24px;color:var(--c)}
#panel .chip svg{width:13px;height:13px;color:var(--cc)}
.node:hover .ic{transform:scale(1.22)}
.node .nm{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10.5px;font-weight:600;letter-spacing:.6px;color:var(--c);background:rgba(2,8,22,.66);
  border:1px solid rgba(255,255,255,.08);border-color:color-mix(in srgb,var(--c) 45%,transparent);
  padding:2px 9px;border-radius:20px;transition:opacity .3s;text-shadow:0 0 8px var(--c)}
.node.agent .nm{font-size:8.5px;padding:1px 6px;top:calc(100% + 3px);font-weight:500}
.node.sel::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1.5px dashed var(--c);
  box-shadow:0 0 16px var(--c);animation:spin 6s linear infinite}
body.net .node.agent .nm{opacity:0}
body.net .node.agent:hover .nm,body.net .node.agent.rel .nm,body.net .node.agent.sel .nm{opacity:1}
.core-hit{border-radius:50%;pointer-events:auto;cursor:pointer}
.core-hit.off{pointer-events:none}
.core-hit .nm{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:12px;
  font-weight:700;letter-spacing:5px;color:var(--cy);text-shadow:0 0 12px var(--cy);opacity:0;transition:opacity .6s}
body.net .core-hit .nm{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Cabecera ── */
#ui{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;
  z-index:10;pointer-events:none;white-space:nowrap}
#ui h1{font-size:12px;color:var(--cy);letter-spacing:5px;font-weight:300;text-transform:uppercase;
  text-shadow:0 0 18px rgba(0,200,255,.95)}
#ui p{font-size:8px;color:var(--muted);letter-spacing:2px;margin-top:3px}

/* ── Botón especial ── */
#netBtn{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:10px;padding:9px 20px 9px 10px;border-radius:40px;
  border:1px solid rgba(0,212,255,.6);background:linear-gradient(135deg,rgba(0,38,70,.88),rgba(38,0,70,.82));
  color:#e6f8ff;font:600 11.5px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:2.5px;text-transform:uppercase;
  cursor:pointer;box-shadow:0 0 24px rgba(0,212,255,.35),inset 0 0 14px rgba(0,212,255,.15);
  backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .8s,box-shadow .3s;white-space:nowrap}
#netBtn.show{opacity:1;pointer-events:auto}
#netBtn:hover{box-shadow:0 0 34px rgba(0,212,255,.6),inset 0 0 14px rgba(0,212,255,.25)}
#netBtn .orb{width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 35%,#fff,#00d4ff 40%,#00406e 78%);box-shadow:0 0 14px #00d4ff;
  animation:pulse 2.2s ease-in-out infinite}
body.net #netBtn .orb{background:radial-gradient(circle at 35% 35%,#fff,#ff4fd8 40%,#4a0060 78%);box-shadow:0 0 14px #ff4fd8}
@keyframes pulse{50%{transform:scale(1.18);filter:brightness(1.3)}}

/* ── Botones secundarios ── */
.mini{position:fixed;z-index:30;background:rgba(0,10,40,.78);border:1px solid rgba(0,150,255,.38);color:#9fd8ff;
  padding:7px 13px;border-radius:8px;cursor:pointer;font-size:11.5px;backdrop-filter:blur(6px);
  transition:opacity .5s;letter-spacing:.5px}
.mini:hover{border-color:rgba(0,220,255,.8);color:#fff}
#skip{top:calc(14px + env(safe-area-inset-top));right:14px}
#netCtl{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:30;display:flex;gap:6px;
  opacity:0;pointer-events:none;transition:opacity .6s}
body.net #netCtl{opacity:1;pointer-events:auto}
#netCtl .mini{position:static}
.hide{opacity:0!important;pointer-events:none!important}

/* ── Panel de información ── */
#panel{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;
  width:min(92vw,380px);max-height:42vh;overflow:auto;padding:14px 16px 12px;border-radius:16px;
  background:linear-gradient(160deg,rgba(4,14,36,.93),rgba(10,4,30,.9));
  border:1px solid rgba(0,180,255,.4);border-color:color-mix(in srgb,var(--c,#00d4ff) 55%,transparent);
  box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px color-mix(in srgb,var(--c,#00d4ff) 25%,transparent);
  backdrop-filter:blur(14px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
  transition:opacity .35s,transform .35s}
#panel.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#panel .ph{display:flex;align-items:center;gap:13px}
#panel .pic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:23px;flex-shrink:0;background:radial-gradient(circle,color-mix(in srgb,var(--c) 35%,transparent),transparent 72%);
  border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}
#panel .pcat{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--c);opacity:.9}
#panel h2{font-size:17px;font-weight:600;color:#fff;letter-spacing:.5px;margin-top:2px}
#panel .pdesc{font-size:12.5px;line-height:1.55;color:#bcd8f2;margin-top:11px}
#panel .pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#panel .chip{display:flex;align-items:center;gap:5px;font-size:11px;padding:5px 10px;border-radius:20px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:#d8ecff;transition:background .2s}
#panel .chip:hover{background:color-mix(in srgb,var(--cc) 25%,transparent);border-color:var(--cc)}
#panel .chip small{opacity:.55;font-size:9.5px}
#pclose{position:absolute;top:10px;right:12px;background:none;border:none;color:#7fb8e0;font-size:16px;cursor:pointer;padding:4px}

#hint{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;
  color:rgba(160,210,250,.75);font-size:11px;letter-spacing:1.5px;pointer-events:none;opacity:0;transition:opacity 1s;white-space:nowrap}
#hint.show{opacity:1}
#legend{position:fixed;bottom:22px;left:14px;z-index:10;display:flex;flex-direction:column;gap:4px;
  opacity:0;transition:opacity .6s;pointer-events:none}
body.net #legend{opacity:1}
.li{display:flex;align-items:center;gap:6px;font-size:9.5px;color:rgba(160,200,235,.7)}
.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}

#play-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:none;align-items:center;
  justify-content:center;flex-direction:column;gap:14px;cursor:pointer}
#play-ov svg{width:64px;height:64px;fill:var(--cy);filter:drop-shadow(0 0 16px var(--cy))}
#play-ov p{color:var(--cy);font-size:13px;letter-spacing:3px}

@media (min-width:900px){
  body.net #panel{left:auto;right:22px;bottom:auto;top:50%;transform:translate(20px,-50%)}
  body.net #panel.open{transform:translate(0,-50%)}
}
@media (max-width:600px){
  #lines{bottom:calc(124px + env(safe-area-inset-bottom))}
  #ui h1{font-size:10px;letter-spacing:3.5px}
  #ui p{font-size:7px;letter-spacing:1.2px}
  #legend{display:none}
  .node .ic svg{width:17px;height:17px}
  .node .nm{font-size:9px;padding:2px 7px}
  #skip,#netCtl{top:auto;bottom:calc(76px + env(safe-area-inset-bottom))}
  #netBtn{font-size:10.5px;letter-spacing:2px}
}
</style>
</head>

function glowTex(col){
  if(texCache[col])return texCache[col];

  const x=c.getContext('2d'),r=(col>>16)&255,g=(col>>8)&255,b=col&255;

  gr.addColorStop(0,`rgba(${r},${g},${b},.9)`);gr.addColorStop(.35,`rgba(${r},${g},${b},.3)`);gr.addColorStop(1,'rgba(0,0,0,0)');

}

/* ═════════════ LAYOUTS ═════════════ */
let W=0,H=0,D=1,uiS=1,R1=200;
const face={sx:0,sy:0,r:60,w:new V3()};
const toWorld=(sx,sy,z=0)=>new V3(sx-W/2,H/2-sy,z);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function computeFace(){
  const s=Math.max(W/VW,H/VH),dw=VW*s,dh=VH*s,ox=(W-dw)/2,oy=(H-dh)/2;
  face.sx=ox+FACE.x*dw;face.sy=oy+FACE.y*dh;face.r=FACE.r*dw;
  face.w.copy(toWorld(face.sx,face.sy,-10));
}
function layoutFace(){
  // Hubs a los lados del rostro, como paréntesis ( · ) alrededor de ARIA
  const small=W<600,m=small?40:80;
  const top=Math.max(small?90:100,face.sy-face.r*1.1);
  const bot=Math.max(top+200,Math.min(H-(small?215:190),face.sy+face.r*6));
  const rx=Math.min(W/2-m,Math.max(face.r*2.7,W*.31));
  [-1,1].forEach(side=>{
    const list=hubs.filter((_,i)=>(i%2===0)===(side<0));
    list.forEach((n,i)=>{
      const t=list.length>1?i/(list.length-1):.5;
      const sy=top+(bot-top)*t;
      const sx=clamp(face.sx+side*rx*(.8+.2*Math.sin(Math.PI*t)),m,W-m);
      n.face.copy(toWorld(sx,sy,60*Math.sin(Math.PI*t)-20));n.side=side;
    });
  });
}
function fibSphere(n,r){
  const pts=[],phi=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,rad=Math.sqrt(Math.max(0,1-y*y)),t=phi*i;
    pts.push(new V3(Math.cos(t)*rad*r,y*r,Math.sin(t)*rad*r));}
  return pts;
}
function layoutNet(){
  R1=Math.min(W,H*1.1)*.23;const R2=R1*1.62;
  const pts=fibSphere(hubs.length,R1);
  hubs.forEach((h,i)=>h.net.copy(pts[i]));
  hubs.forEach(h=>{
    const ags=byHub[h.d.id]||[],cnt=ags.length,hd=h.net.clone().normalize();
    const tu=Math.abs(hd.y)<.9?new V3(0,1,0):new V3(1,0,0);
    const right=new V3().crossVectors(hd,tu).normalize(),fwd=new V3().crossVectors(right,hd).normalize();
    ags.forEach((a,i)=>{
      const phi=cnt>1?(i/(cnt-1))*Math.PI*1.65-Math.PI*.825:0,sp=cnt<=2?.22:cnt<=4?.35:.44;
      a.net.copy(hd.clone().addScaledVector(right,Math.cos(phi)*sp).addScaledVector(fwd,Math.sin(phi)*sp)
        .addScaledVector(new V3(0,1,0),(i%3-1)*.12).normalize().multiplyScalar(R2));
    });
  });
}
function agentFacePos(a,T){
  // Sub-nodos en abanico alrededor del hub abierto (hacia fuera si hay espacio, si no hacia dentro)
  const h=byId[a.d.hub],ags=byHub[h.d.id],k=ags.length,i=ags.indexOf(a);
  const R=(W<600?56:74)+k*2;
  const hsx=W/2+h.face.x,room=h.side<0?hsx:W-hsx;
  const outward=room>R+40;
  const dir=outward?(h.side<0?Math.PI:0):(h.side<0?0:Math.PI);
  const spread=Math.min(Math.PI*1.3,(k-1)*.48);
  const ang=dir+(k>1?(i/(k-1)-.5)*spread:0)+Math.sin(T*.5)*.07;
  const p=h.face.clone().add(new V3(Math.cos(ang)*R,Math.sin(ang)*R,25));
  p.x=clamp(p.x,-W/2+22,W/2-22);
  return p;
}

let maskK=1;
function faceMask(p){
  if(maskK<.001)return 1;
  const d=Math.hypot(p.x-coreG.position.x,p.y-coreG.position.y);
  return 1-maskK*(1-smooth((d-face.r*1.0)/(face.r*1.5)));
}
const pA=new V3(),pB=new V3();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  videoTick();
  const k=1-Math.exp(-dt*5.2),net=mode==='net',sh=selHub();

  // Núcleo
  coreG.position.lerp(net?new V3(0,0,0):face.w,k);
  const cs=net?R1*.3:face.r*1.4;
  coreG.scale.setScalar(THREE.MathUtils.lerp(coreG.scale.x,cs,k));
  coreSphere.scale.setScalar(THREE.MathUtils.lerp(coreSphere.scale.x,net?.55:.001,k));
  coreSphere.material.emissiveIntensity=.65+Math.sin(T*1.8)*.2;
  coreGlow.material.opacity+=((net?.95:0)-coreGlow.material.opacity)*k;
  maskK+=((net?0:1)-maskK)*k;
  const ringOp=mode==='intro'?0:net?.55:.07;   // halo casi invisible sobre el rostro
  coreRings.forEach((r,i)=>{
    r.material.opacity+=(ringOp*(1-i*.2)-r.material.opacity)*k;
    r.rotation.x=1.25+i*.18+Math.sin(T*.4+i)*.12;
    r.rotation.y=Math.sin(T*.3+i*2)*.35;
    r.rotation.z=T*(.25+i*.12)*(i%2?-1:1);
  });
  const cpx=(net?cs*1.15:face.r*2.1)|0;
  if(cpx!==cpxLast){cpxLast=cpx;coreEl.style.width=coreEl.style.height=cpx+'px';}

  // Nodos
  nodes.forEach(n=>{
    let tgt,sT;
    if(n.kind==='hub'){tgt=net?n.net:n.face;sT=mode==='intro'||T<n.appearAt?0:1;}
    else{
      const h=byId[n.d.hub];
      if(net){tgt=n.net;sT=1;}
      else if(expanded===h){tgt=agentFacePos(n,T);sT=1;}
      else{tgt=h.pos;sT=0;}
    }
    n.pos.lerp(tgt,n.kind==='agent'&&!net?Math.min(1,k*1.6):k);
    n.s+=(sT-n.s)*Math.min(1,k*1.5);
    let dim=1;
    if(!net&&expanded&&n.kind==='hub'&&n!==expanded)dim=.35;
    if(net&&sh){const rel=n===sh||(n.kind==='agent'&&n.d.hub===sh.d.id)||n===selected;dim=rel?1:.3;}
    n.da+=(dim-n.da)*k*1.5;
    bob.set(Math.sin(T*.7+n.phase)*3,Math.sin(T*.9+n.phase)*5,Math.cos(T*.6+n.phase)*14);
    n.g.position.copy(n.pos).add(bob);
    n.g.scale.setScalar(Math.max(.001,n.s*uiS));
    n.mat.opacity=.9*n.da;n.ringMat.opacity=.6*n.da;n.glow.material.opacity=.9*n.da;
    n.mat.emissiveIntensity=.45+Math.sin(T*1.5+n.idx)*.15+(n===selected?.45:0);
    n.ring.rotation.z+=dt*(n.kind==='hub'?.7:1.2);
    n.ring.rotation.x=1.15+Math.sin(T*.5+n.phase)*.25;
    if(n.ring2)n.ring2.rotation.x-=dt*.5;
    // tocar el DOM solo cuando cambia de verdad (evita recálculos de estilo en cada cuadro)
    const op=Math.round(Math.min(1,n.s)*n.da*100)/100;
    if(op!==n.op){n.op=op;n.el.style.opacity=op;}
    const off=n.s<.35;if(off!==n.off){n.off=off;n.el.classList.toggle('off',off);}
  });

  // Conexiones
  segs.forEach((s,i)=>{
    let t=0;
    if(mode==='face'){
      if(s.kind==='core')t=s.b.s*(expanded&&expanded!==s.b?.12:.5);
      else if(s.kind==='agent')t=expanded===s.a?.6*s.b.s:0;
    }else if(net){
      t=s.kind==='core'?.45:s.kind==='agent'?.28:.34;
      if(sh){
        const rel=(s.kind==='core'&&s.b===sh)||(s.kind==='agent'&&s.a===sh)||
          (s.kind==='cross'&&(s.a===selected||s.b===selected));
        t=rel?.95:t*.22;
      }
    }
    s.al+=(t-s.al)*Math.min(1,k*1.5);
    const B=s.b.g.position,A=s.a?s.a.g.position:corePoint(B,tmpA);
    for(let j=0;j<SUB;j++){
      const u0=j/SUB,u1=(j+1)/SUB,o=(i*SUB+j);
      pA.lerpVectors(A,B,u0);pB.lerpVectors(A,B,u1);
      const q=o*6;segPos[q]=pA.x;segPos[q+1]=pA.y;segPos[q+2]=pA.z;segPos[q+3]=pB.x;segPos[q+4]=pB.y;segPos[q+5]=pB.z;
      // las conexiones al núcleo nacen transparentes y se encienden hacia el nodo
      const g0=s.kind==='core'?smooth(u0/.75):1,g1=s.kind==='core'?smooth(u1/.75):1;
      const w=o*8;segCol[w]=segCol[w+4]=s.c.r;segCol[w+1]=segCol[w+5]=s.c.g;segCol[w+2]=segCol[w+6]=s.c.b;
      segCol[w+3]=s.al*g0*faceMask(pA);segCol[w+7]=s.al*g1*faceMask(pB);
    }
  });
  segGeo.attributes.position.needsUpdate=true;segGeo.attributes.color.needsUpdate=true;

  // Impulsos viajando del núcleo hacia los nodos
  pulses.forEach(p=>{
    p.p=(p.p+dt*p.v)%1;
    const s=p.s,B=s.b.g.position,A=s.a?s.a.g.position:corePoint(B,tmpB);
    p.sp.position.lerpVectors(A,B,p.p);
    p.sp.material.opacity=Math.sin(p.p*Math.PI)*Math.min(1,s.al*1.8)*faceMask(p.sp.position);
  });

  // Cámara
  par.x+=(par.tx-par.x)*.04;par.y+=(par.ty-par.y)*.04;
  if(net){
    if(camGoal){camera.position.lerp(camGoal,k*.9);if(camera.position.distanceTo(camGoal)<D*.01)camGoal=null;}
    controls.update();
  }else{
    camera.position.lerp(tmpA.set(par.x*W*.03,par.y*H*.03,D),k*1.2);
    camera.up.set(0,1,0);camera.lookAt(0,0,0);
  }

  renderer.render(scene,camera);
  css2d.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body></html>
