<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
canvas{display:block}
#ui{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none;white-space:nowrap}
#ui h1{font-size:11px;color:#00d4ff;letter-spacing:4px;font-weight:300;text-transform:uppercase;text-shadow:0 0 18px rgba(0,200,255,.95)}
#ui p{font-size:7.5px;color:rgba(100,160,210,.45);letter-spacing:2px;margin-top:2px}
#tooltip{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:rgba(4,12,38,.97);border:1px solid rgba(0,180,255,.4);border-radius:10px;
  padding:12px 20px;z-index:20;color:#cce4ff;font-size:12px;min-width:220px;max-width:320px;
  text-align:center;display:none;pointer-events:none;backdrop-filter:blur(10px);
  box-shadow:0 4px 24px rgba(0,180,255,.15)}
#tooltip strong{color:#00d4ff;display:block;margin-bottom:5px;font-size:15px;letter-spacing:.5px}
#tooltip .sub{font-size:10.5px;opacity:.8;line-height:1.5}
#tooltip .cat{font-size:9px;opacity:.45;margin-top:7px;letter-spacing:1.5px;text-transform:uppercase}
#hint{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  color:rgba(100,160,210,.4);font-size:10px;letter-spacing:1px;z-index:10;
  pointer-events:none;animation:fadeout 4s 2s forwards}
@keyframes fadeout{to{opacity:0}}
#legend{position:fixed;bottom:16px;left:12px;z-index:10;display:flex;flex-wrap:wrap;gap:3px 10px;max-width:200px}
.li{display:flex;align-items:center;gap:4px;font-size:7px;color:rgba(140,185,225,.5)}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0}
#ctrl{position:fixed;bottom:16px;right:12px;z-index:10;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#ctrl button{background:rgba(0,20,60,.88);border:1px solid rgba(0,150,255,.38);color:#88ccff;
  padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#ctrl button:active{background:rgba(0,60,160,.85)}
.lbl{color:#fff;font-size:9px;padding:2px 6px;background:rgba(0,0,0,.55);border-radius:4px;pointer-events:none;white-space:nowrap;user-select:none}
.lbl-hub{font-size:10.5px;font-weight:600;padding:3px 8px}
</style>

function fibSphere(n,r){
  const pts=[],phi=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,rad=Math.sqrt(Math.max(0,1-y*y)),t=phi*i;
    pts.push(new THREE.Vector3(Math.cos(t)*rad*r,y*r,Math.sin(t)*rad*r));}
  return pts;
}

function glowSprite(col,size){
  const c=document.createElement('canvas');c.width=c.height=128;
  const ctx=c.getContext('2d'),r=(col>>16)&255,g=(col>>8)&255,b=col&255;
  const gr=ctx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);
  gr.addColorStop(.35,`rgba(${r},${g},${b},.45)`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,128,128);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.scale.setScalar(size);return sp;
}

function emojiSprite(emoji,size,css){
  const c=document.createElement('canvas');c.width=c.height=128;
  const ctx=c.getContext('2d');
  ctx.beginPath();ctx.arc(64,64,56,0,Math.PI*2);
  ctx.fillStyle=css+'22';ctx.fill();
  ctx.strokeStyle=css+'66';ctx.lineWidth=3;ctx.stroke();
  ctx.font='60px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(emoji,64,66);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  sp.scale.setScalar(size);return sp;
}

function mkLine(p1,p2,col,op){
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]),

}

function cssLbl(text,cls){

}

// ── Agentes con íconos ────────────────────────────────────────────────────────
const byHub={};AGENTS.forEach(a=>{(byHub[a.hub]||(byHub[a.hub]=[])).push(a);});
HUBS.forEach(hub=>{
  const hubPos=nodeMap[hub.id].pos,agents=byHub[hub.id]||[],col=C[hub.cat].hex,count=agents.length;
  const hd=hubPos.clone().normalize();
  const tu=Math.abs(hd.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const right=new THREE.Vector3().crossVectors(hd,tu).normalize();
  const fwd=new THREE.Vector3().crossVectors(right,hd).normalize();
  agents.forEach((agent,i)=>{
    const phi=count>1?(i/(count-1))*Math.PI*1.65-Math.PI*.825:0;
    const sp=count<=2?.22:count<=4?.35:.44;
    const ao=(i%3-1)*.12;
    const dir=hd.clone().addScaledVector(right,Math.cos(phi)*sp).addScaledVector(fwd,Math.sin(phi)*sp)
      .addScaledVector(new THREE.Vector3(0,1,0),ao).normalize().multiplyScalar(438);
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(10,14,14),
      new THREE.MeshPhongMaterial({color:0x020609,emissive:col,emissiveIntensity:.65,shininess:40}));
    mesh.position.copy(dir); scene.add(mesh);
    mesh.add(glowSprite(col,50));
    if(agent.icon)mesh.add(emojiSprite(agent.icon,28,C[agent.cat].css));
    nodeMap[agent.id]={mesh,pos:dir.clone(),data:agent};
    clickable.push(mesh);
    scene.add(mkLine(hubPos,dir,col,.22));
  });
});

const raycaster=new THREE.Raycaster();const ptr=new THREE.Vector2();
let ptDown=null,dragDist=0;
renderer.domElement.addEventListener('pointerdown',e=>{ptDown={x:e.clientX,y:e.clientY};dragDist=0;});
renderer.domElement.addEventListener('pointermove',e=>{if(ptDown)dragDist+=Math.hypot(e.clientX-ptDown.x,e.clientY-ptDown.y);});
renderer.domElement.addEventListener('pointerup',e=>{
  if(dragDist<10&&ptDown){
    ptr.x=(e.clientX/window.innerWidth)*2-1;ptr.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(ptr,camera);
    const hits=raycaster.intersectObjects(clickable,false);
    if(hits.length){const en=Object.values(nodeMap).find(n=>n.mesh===hits[0].object);if(en)showTip(en.data);}
    else hideTip();
  }ptDown=null;
});
function showTip(d){
  document.getElementById('tn').textContent=d.label;
  document.getElementById('td').textContent=d.tip||'';
  document.getElementById('tc').textContent=C[d.cat]?.name||'';
  document.getElementById('tooltip').style.display='block';
  document.getElementById('hint').style.display='none';
}
function hideTip(){document.getElementById('tooltip').style.display='none';}

const clock=new THREE.Clock();let frame=0;
function animate(){
  requestAnimationFrame(animate);const t=clock.getElapsedTime();frame++;
  const aria=nodeMap['aria'].mesh;
  aria.rotation.y=t*.1;
  aria.userData.r1.rotation.y=t*.5;aria.userData.r1.rotation.z=Math.sin(t*.4)*.3;
  aria.userData.r2.rotation.y=-t*.3;aria.userData.r2.rotation.x=Math.PI/4+Math.sin(t*.2)*.2;
  coreLight.intensity=3.5+Math.sin(t*1.8)*1.0;
  if(frame%3===0)HUBS.forEach((h,i)=>{nodeMap[h.id].mesh.material.emissiveIntensity=.65+Math.sin(t*1.4+i*.9)*.25;});
  if(frame%4===0)AGENTS.forEach((a,i)=>{const n=nodeMap[a.id];if(n)n.mesh.material.emissiveIntensity=.45+Math.sin(t*1.1+i*.5)*.2;});
  particles.forEach(p=>{p.t=(p.t+p.spd)%1;p.mesh.position.lerpVectors(ORIGIN,p.to,p.t);p.mesh.material.opacity=Math.sin(p.t*Math.PI)*.9;});
  controls.update();renderer.render(scene,camera);css2d.render(scene,camera);
}
